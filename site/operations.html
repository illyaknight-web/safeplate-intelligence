<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SAFEPLATE Operations</title><style>:root{--g:#17693d;--ink:#122018;--mut:#617067;--line:#d7dfd8;--red:#a93226}*{box-sizing:border-box}body{margin:0;background:#edf2ed;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 4vw;background:#06150c;color:#fff;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:22px}.brand small{display:block;color:#8fa298;font-size:10px}.auth{display:flex;gap:8px}.auth input{width:min(300px,45vw);padding:10px;border:1px solid #45614f;border-radius:10px;background:#10271a;color:#fff}.auth button,.action{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:850}main{max-width:1400px;margin:auto;padding:24px 4vw}.notice,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.notice{margin-bottom:16px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.metric small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase}.metric strong{display:block;margin-top:6px;font-size:24px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.panel h2{margin:0 0 12px}.row{padding:12px 0;border-top:1px solid #e4e9e5}.row:first-child{border-top:0}.row small{color:var(--mut)}.bad{color:var(--red)}.reasons{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.reasons span{font-size:9px;background:#f5eee8;border-radius:999px;padding:5px 7px}.rowActions{display:flex;gap:6px}.rowActions button{border:1px solid #cbd7cd;background:#f5f8f5;color:#21482e;border-radius:8px;padding:7px 9px;font-weight:800}@media(max-width:900px){header{display:block}.auth{margin-top:12px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">SAFEPLATE™ OPERATIONS<small>Private review and system health</small></div><form class="auth" id="auth"><input id="token" type="password" autocomplete="current-password" placeholder="Admin access token" aria-label="Admin access token"><button>Open dashboard</button></form></header><main><div class="notice" id="message">Enter the authorized operations token. It is kept only for this browser tab.</div><div id="dashboard" hidden><section class="metrics" id="metrics"></section><div class="grid"><section class="panel"><h2>Review queue</h2><div id="reviews"></div></section><section class="panel"><h2>Source health</h2><div id="sources"></div></section></div></div></main><script src="/operations.js"></script></body></html>

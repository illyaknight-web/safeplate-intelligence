<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAFEPLATE Recall Widget</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font:16px/1.4 Arial,sans-serif;background:#faf7ef;color:#10251a}.box{border:1px solid #b8cabd;border-radius:18px;background:#fff;padding:16px}h2{margin:0 0 10px}input,button{font:inherit;min-height:48px;border-radius:12px;padding:9px 12px}input{width:65%;border:2px solid #829b89}button{border:0;background:#07552f;color:#fff;font-weight:800}.result{margin-top:12px}.notice{font-size:12px;color:#52645a}a{color:#07552f;font-weight:800}</style></head><body><div class="box"><h2>Check a food recall</h2><form id="f"><label for="q">Product, brand or UPC</label><br><input id="q" required><button>Check</button></form><div id="r" class="result" aria-live="polite"></div><p class="notice">SAFEPLATE aggregates official records and is not FDA or USDA. Verify at the linked official source.</p><a href="https://safeplate-intelligence.netlify.app/booth" target="_blank" rel="noopener">Open SAFEPLATE Booth Mode</a></div><script>f.onsubmit=async e=>{e.preventDefault();r.textContent='Checking…';try{const x=await fetch('/api/recall-service?q='+encodeURIComponent(q.value)).then(v=>v.json());r.innerHTML=x.count?'<strong>Potential official record match found.</strong> Open SAFEPLATE to verify the exact package, UPC and lot.':'<strong>No matching current record found.</strong> This is not a guarantee the food is safe.'}catch{r.textContent='Official information is temporarily unavailable.'}}</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020705"><title>SAFEPLATE™ by Function Media LLC</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020705;color:#fff}.siteHeader{position:fixed;z-index:1000;top:0;left:0;right:0;height:82px;padding:10px 24px;display:grid;grid-template-columns:1fr minmax(310px,620px) 1fr;gap:16px;align-items:center;background:rgba(2,8,5,.98);border-bottom:1px solid #1d3c2c}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#0b6b36,#12a055);display:grid;place-items:center;font-weight:950;font-size:20px}.brand strong{font-size:18px}.brand small{display:block;color:#7f9188;font-size:9px}.viewSwitch{display:grid;grid-template-columns:1fr 1fr;border:1px solid #315640;border-radius:18px;overflow:hidden;background:#07150d}.viewSwitch button{border:0;padding:15px 12px;background:transparent;color:#c6d1ca;font-size:15px;font-weight:900}.viewSwitch button.active{background:linear-gradient(135deg,#0b4c29,#118449);color:#fff}.headerMeta{justify-self:end;color:#7b8e83;font-size:10px}.stage{position:fixed;top:82px;left:0;right:0;bottom:0}.viewFrame{position:absolute;inset:0;width:100%;height:100%;border:0;transition:opacity .18s ease;background:#fff}.viewFrame.inactive{opacity:0;visibility:hidden;pointer-events:none;z-index:1}.viewFrame.active{opacity:1;visibility:visible;pointer-events:auto;z-index:2}#advancedFrame{background:#030906}@media(max-width:760px){.siteHeader{height:126px;padding:9px 10px;grid-template-columns:1fr;gap:8px}.brand{justify-content:center}.headerMeta{display:none}.viewSwitch{width:100%}.viewSwitch button{font-size:14px;padding:13px 8px}.stage{top:126px}}</style></head><body><header class="siteHeader"><div class="brand"><div class="mark">S</div><div><strong>SAFEPLATE™</strong><small>by Function Media LLC</small></div></div><div class="viewSwitch"><button id="pubBtn" class="active">Public View</button><button id="advBtn">Advanced View</button></div><div class="headerMeta">One site · two views · 30-minute live checks</div></header><main class="stage"><iframe id="publicFrame" class="viewFrame active" title="SAFEPLATE Public View" src="/public-view-v1.html?embed=1&assetfix=20260902b"></iframe><iframe id="advancedFrame" class="viewFrame inactive" title="SAFEPLATE Advanced View" src="/advanced-intelligence-v16.html?embed=1"></iframe></main><script>
const pub=document.getElementById('publicFrame'),adv=document.getElementById('advancedFrame'),pb=document.getElementById('pubBtn'),ab=document.getElementById('advBtn');
const PUBLIC_IMAGE_MAP=[
  [/public-hero-1-confirmed\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-1.webp?v=20260902-clean'],
  [/public-hero-2-confirmed\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-2.webp?v=20260902-clean'],
  [/public-hero-3-confirmed\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-3.webp?v=20260902-clean'],
  [/public-hero-4-confirmed\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-4.webp?v=20260902-clean'],
  [/public-hero-5-confirmed\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-5.webp?v=20260902-clean'],
  [/public-recall-v3\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-1.webp?v=20260902-clean'],
  [/public-fresh-v3\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-2.webp?v=20260902-clean'],
  [/public-store-v3\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-3.webp?v=20260902-clean'],
  [/public-cook-v3\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-4.webp?v=20260902-clean'],
  [/public-journey-v3\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-5.webp?v=20260902-clean'],
  [/public-main-v3\.jpg(?:\?[^\"']*)?/i,'/assets/public-hero-5.webp?v=20260902-clean']
];
function cleanPublicImages(){
  try{
    const d=pub.contentDocument;if(!d)return;
    const rewrite=img=>{const raw=img.getAttribute('src')||'';for(const [re,to] of PUBLIC_IMAGE_MAP){if(re.test(raw)){if(img.dataset.safeplateClean!==to){img.dataset.safeplateClean=to;img.src=to;}break;}}};
    d.querySelectorAll('img').forEach(rewrite);
    if(!d.__safeplateImageObserver){
      const mo=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches?.('img'))rewrite(n);n.querySelectorAll?.('img').forEach(rewrite);})));mo.observe(d.documentElement,{childList:true,subtree:true});d.__safeplateImageObserver=mo;
    }
  }catch(e){console.error('SAFEPLATE Public image repair failed',e)}
}
pub.addEventListener('load',()=>{cleanPublicImages();setTimeout(cleanPublicImages,150);setTimeout(cleanPublicImages,800)});
function mode(v,recordId){const a=v==='advanced';pub.className='viewFrame '+(a?'inactive':'active');adv.className='viewFrame '+(a?'active':'inactive');pb.classList.toggle('active',!a);ab.classList.toggle('active',a);history.replaceState(null,'',a?'#advanced':'#public');if(a){adv.contentWindow?.postMessage({type:'safeplate-visible',mode:'advanced'},'*');if(recordId)setTimeout(()=>adv.contentWindow?.postMessage({type:'safeplate-select-record',recordId},'*'),150)}else{cleanPublicImages()}}
pb.onclick=()=>mode('public');ab.onclick=()=>mode('advanced');window.addEventListener('message',e=>{if(e.data?.type==='safeplate-mode')mode(e.data.mode,e.data.recordId)});if(location.hash==='#advanced')mode('advanced');
</script></body></html>

name: SAFEPLATE Meeting Critical Regression Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/shell-v2.js'
      - 'site/booth-upgrades.js'
      - 'site/safeplate-shell.html'
      - 'site/public-view-v1.html'
      - 'netlify/functions/lib/recall-search.mjs'
      - 'netlify/functions/recall-service.mjs'
      - 'netlify/functions/recall-photo.mjs'
      - 'netlify.toml'
      - '.github/workflows/meeting-critical-regression.yml'
  schedule:
    - cron: '20,50 * * * *'

jobs:
  meeting-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production and verify critical paths
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://safeplate-intelligence.netlify.app'
          mkdir -p meeting-smoke

          deployed=''
          for attempt in $(seq 1 24); do
            curl -sS "$BASE/deployment.json?attempt=$attempt" -o meeting-smoke/deployment.json || true
            deployed=$(python - <<'PY'
          import json
          try:
              print(json.load(open('meeting-smoke/deployment.json')).get('commit') or '')
          except Exception:
              print('')
          PY
            )
            echo "Production check $attempt: expected ${GITHUB_SHA}, observed ${deployed:-unavailable}"
            [ "$deployed" = "$GITHUB_SHA" ] && break
            sleep 15
          done
          [ "$deployed" = "$GITHUB_SHA" ] || { echo '::error::Production did not reach this commit'; exit 1; }

          curl -fsSL "$BASE/" -o meeting-smoke/home.html
          curl -fsSL "$BASE/shell-v2.js" -o meeting-smoke/shell-v2.js
          curl -fsSL "$BASE/booth-upgrades.js" -o meeting-smoke/booth-upgrades.js
          curl -fsSL "$BASE/booth" -o meeting-smoke/booth.html
          curl -fsSL "$BASE/api/system-status" -o meeting-smoke/system-status.json
          curl -fsSL "$BASE/api/recall-service?q=current%20recall&limit=100" -o meeting-smoke/current-recalls.json

          curl -fsSI "$BASE/shell-v2.js" -o meeting-smoke/shell-headers.txt
          curl -fsSI "$BASE/booth-upgrades.js" -o meeting-smoke/booth-headers.txt

          grep -Fq "safeplateRecallFreshnessPatch==='11'" meeting-smoke/shell-v2.js || { echo '::error::Recall freshness controller is not release 11'; exit 1; }
          grep -Fq 'sourceRecordTime' meeting-smoke/shell-v2.js || { echo '::error::Authoritative source-date recall logic missing'; exit 1; }
          grep -Fq '45*864e5' meeting-smoke/shell-v2.js || { echo '::error::45-day recent-recall window missing'; exit 1; }
          ! grep -Fq '400*864e5' meeting-smoke/shell-v2.js || { echo '::error::Legacy 400-day recall window returned'; exit 1; }
          grep -Fq 'Official package image unavailable' meeting-smoke/shell-v2.js || { echo '::error::Truthful package-image fallback missing'; exit 1; }
          grep -Fq 'Verify at official source' meeting-smoke/shell-v2.js || { echo '::error::Official-source verification link missing'; exit 1; }

          grep -Fqi 'cache-control: public, max-age=0, must-revalidate' meeting-smoke/shell-headers.txt || { echo '::error::shell-v2.js may remain stale in browsers'; exit 1; }
          grep -Fqi 'cache-control: public, max-age=0, must-revalidate' meeting-smoke/booth-headers.txt || { echo '::error::booth-upgrades.js may remain stale in browsers'; exit 1; }

          grep -Fq "if(isiOS){status.textContent='Opening camera…';capture.click();return}" meeting-smoke/booth-upgrades.js || { echo '::error::iOS native camera fallback missing'; exit 1; }
          grep -Fq 'decodeFromImageElement' meeting-smoke/booth-upgrades.js || { echo '::error::Captured barcode decode path missing'; exit 1; }
          grep -Fq "frames.booth.setAttribute('allow','camera')" meeting-smoke/shell-v2.js || { echo '::error::Booth iframe camera permission missing'; exit 1; }
          grep -Fq "touchAction='pan-y'" meeting-smoke/shell-v2.js || { echo '::error::Booth mobile scroll repair missing'; exit 1; }

          grep -Fq 'id="pubBtn"' meeting-smoke/home.html || { echo '::error::Public tab missing'; exit 1; }
          grep -Fq 'id="boothBtn"' meeting-smoke/home.html || { echo '::error::Booth tab missing'; exit 1; }
          grep -Fq 'id="advBtn"' meeting-smoke/home.html || { echo '::error::Advanced tab missing'; exit 1; }
          grep -Fq 'advanced-intelligence-v16.html' meeting-smoke/home.html || { echo '::error::Advanced v16 route missing'; exit 1; }
          ! grep -Fq 'unified-intelligence-v12' meeting-smoke/home.html || { echo '::error::Stale Advanced v12 route returned'; exit 1; }

          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          status=json.load(open('meeting-smoke/system-status.json'))
          if not status.get('live'):
              raise SystemExit('system-status is not live')

          payload=json.load(open('meeting-smoke/current-recalls.json'))
          rows=payload.get('records',[])
          now=datetime.now(timezone.utc)
          floor=now-timedelta(days=45)
          ceiling=now+timedelta(days=1)
          fields=('recallDate','recall_initiation_date','announcedDate','sourcePostedAt','publicationDate','publishedAt','report_date','reportDate','date')

          def parse(v):
              if not v: return None
              s=str(v).strip()
              if len(s)==8 and s.isdigit():
                  return datetime(int(s[:4]),int(s[4:6]),int(s[6:8]),tzinfo=timezone.utc)
              try:
                  return datetime.fromisoformat(s.replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  return None

          failures=[]
          for r in rows:
              if r.get('temporal_match')!='CURRENT':
                  failures.append(f"historical record returned as current: {r.get('title')}")
                  continue
              t=next((parse(r.get(k)) for k in fields if parse(r.get(k))),None)
              if not t:
                  failures.append(f"current record lacks authoritative source date: {r.get('title')}")
              elif not (floor < t <= ceiling):
                  failures.append(f"out-of-window current record {t.date()}: {r.get('title')}")
              if any(word in str(r.get('status','')).lower() for word in ('terminated','resolved','closed','retracted')):
                  failures.append(f"closed record returned as current: {r.get('title')}")

          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'Meeting-critical recall gate passed with {len(rows)} current records.')
          PY

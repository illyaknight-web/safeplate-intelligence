name: Sync SAFEPLATE site assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-safeplate-site-assets.yml

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy SAFEPLATE imagery into Netlify publish directory
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp safeplate-function-media-editorial.jpg site/assets/safeplate-editorial.jpg
          cp safeplate-function-media-banner.jpg site/assets/safeplate-banner.jpg
          cp safeplate-function-media-brand-card.jpg site/assets/safeplate-brand-card.jpg
          cp safeplate-function-media-social.jpg site/assets/safeplate-social.jpg
          test -s site/assets/safeplate-editorial.jpg
          test -s site/assets/safeplate-banner.jpg
          test -s site/assets/safeplate-brand-card.jpg
          test -s site/assets/safeplate-social.jpg
      - name: Commit published visual assets
        run: |
          git config user.name "safeplate-site-assets"
          git config user.email "actions@users.noreply.github.com"
          git add site/assets
          git commit -m "Publish SAFEPLATE visual assets [skip actions]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: SAFEPLATE Jean-Standard Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safeplate-jean-diagnostic.yml'
      - 'netlify/functions/**'
      - 'site/**'
      - 'netlify.toml'
  schedule:
    - cron: '5 3,15 * * *'

permissions:
  contents: read

jobs:
  jean-standard-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify SAFEPLATE public, health, source and recall integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://safeplate-intelligence.netlify.app'
          mkdir -p diagnostic

          curl -fsSL --max-time 25 "$BASE/" -o diagnostic/home.html
          curl -fsSL --max-time 25 "$BASE/public-view-v1.html" -o diagnostic/public.html
          curl -fsSL --max-time 25 "$BASE/safeplate-pulse.html" -o diagnostic/pulse.html
          curl -fsSL --max-time 25 "$BASE/advanced-mobile-fix.js" -o diagnostic/advanced-upgrades.js
          curl -fsSL --max-time 25 "$BASE/api/platform-health?ts=$(date +%s)" -o diagnostic/platform-health.json
          curl -fsSL --max-time 25 "$BASE/api/source-health?ts=$(date +%s)" -o diagnostic/source-health.json
          curl -fsSL --max-time 25 "$BASE/api/system-status?ts=$(date +%s)" -o diagnostic/system-status.json
          curl -fsSL --max-time 25 "$BASE/api/recall-service?q=current%20recall&limit=100&ts=$(date +%s)" -o diagnostic/current-recalls.json
          curl -fsSL --max-time 25 'https://api.fda.gov/food/enforcement.json?limit=100&search=status:%22Ongoing%22' -o diagnostic/openfda-authoritative.json

          grep -Fq 'id="pubBtn"' diagnostic/home.html
          grep -Fq 'id="advBtn"' diagnostic/home.html
          grep -Fq 'Know what’s going on with your food.' diagnostic/public.html
          grep -Fq 'Food Safety Pulse' diagnostic/pulse.html
          grep -Fq 'Is my food affected?' diagnostic/pulse.html
          grep -Fq 'Jean / USDA impact evidence' diagnostic/pulse.html
          grep -Fq 'Explainable risk' diagnostic/pulse.html
          grep -Fq 'FULL SCREEN MAP' diagnostic/advanced-upgrades.js
          grep -Fq 'GOVERNMENT / INSTITUTION MODE' diagnostic/advanced-upgrades.js

          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          p=Path('diagnostic'); failures=[]; report={}
          health=json.loads((p/'platform-health.json').read_text()); report['platformHealth']=health
          if not health.get('healthy'): failures.append('platform-health reported unhealthy')
          sp=health.get('safeplate') or {}
          if not sp.get('live'): failures.append(f"SAFEPLATE surveillance not live; age={sp.get('ageMinutes')}")
          completeness=sp.get('completeness') or {}; report['fdaCompleteness']=completeness
          if completeness.get('state') != 'RECONCILED': failures.append(f"FDA completeness is not RECONCILED: {completeness.get('state')}")
          if not completeness.get('healthy'): failures.append('FDA completeness health is false')
          if completeness.get('ageMinutes') is None or completeness.get('ageMinutes') > 75: failures.append(f"FDA reconciliation stale; age={completeness.get('ageMinutes')}")
          if completeness.get('missingAfter') != 0: failures.append(f"FDA reconciliation still missing authoritative records: {completeness.get('missingAfter')}")
          crit=sp.get('criticalSources') or {}
          if crit.get('ageMinutes') is None or crit.get('ageMinutes') > 35: failures.append(f"critical federal surveillance stale; age={crit.get('ageMinutes')}")
          ew=sp.get('earlyWarning') or {}
          if not ew.get('live'): failures.append(f"early-warning not live; age={ew.get('ageMinutes')}")
          states=sp.get('stateSurveillance') or {}
          if not states.get('live') or states.get('checked') != states.get('total'): failures.append(f"state coverage incomplete; {states.get('checked')}/{states.get('total')}")
          v=health.get('veriscope') or {}
          if v.get('status') not in {'SHADOW_NO_CHANGES','SHADOW_DELIVERED'}: failures.append(f"VERISCOPE bridge unhealthy: {v.get('status')}")
          if v.get('ageMinutes') is None or v.get('ageMinutes') > 35: failures.append(f"VERISCOPE bridge stale; age={v.get('ageMinutes')}")
          if v.get('error'): failures.append(f"VERISCOPE bridge error: {v.get('error')}")

          src=json.loads((p/'source-health.json').read_text()); report['sourceHealthSummary']={k:src.get(k) for k in ('overall','lastSync','online','checked','issues','completeness')}
          if src.get('overall') in {'stale','degraded'}: failures.append(f"source-health overall status is {src.get('overall')}")
          by_id={str(x.get('id')):x for x in (src.get('sources') or [])}
          for sid,label in [('fda_openfda','FDA openFDA'),('fda_reconciliation','FDA reconciliation'),('usda_fsis','USDA FSIS'),('cdc_content','CDC active outbreaks')]:
              row=by_id.get(sid)
              if not row: failures.append(f'{label} is missing from executed source-health evidence'); continue
              if row.get('status') != 'ONLINE': failures.append(f"{label} is not ONLINE: {row.get('status')} {row.get('note')}")
              if not row.get('lastChecked'): failures.append(f'{label} lacks lastChecked evidence')

          status=json.loads((p/'system-status.json').read_text()); report['systemStatus']=status
          if not status.get('live'): failures.append('system-status surveillance is not live')
          if not status.get('reconciled'): failures.append(f"system-status is not reconciled: {(status.get('completeness') or {}).get('state')}")
          if status.get('state') != 'LIVE': failures.append(f"system-status state is {status.get('state')}")

          payload=json.loads((p/'current-recalls.json').read_text()); rows=payload.get('records') or []; report['currentRecallCount']=len(rows)
          now=datetime.now(timezone.utc); floor=now-timedelta(days=45); ceiling=now+timedelta(days=1)
          fields=('recallDate','recall_initiation_date','announcedDate','sourcePostedAt','publicationDate','publishedAt','report_date','reportDate','date')
          def parse(v):
              if not v: return None
              s=str(v).strip()
              if len(s)==8 and s.isdigit():
                  try: return datetime(int(s[:4]),int(s[4:6]),int(s[6:8]),tzinfo=timezone.utc)
                  except Exception: return None
              try: return datetime.fromisoformat(s.replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception: return None
          with_evidence=0
          for r in rows:
              if r.get('temporal_match') != 'CURRENT': failures.append(f"historical record surfaced as current: {r.get('title')}"); continue
              t=next((parse(r.get(k)) for k in fields if parse(r.get(k))),None)
              if not t: failures.append(f"current record lacks authoritative date: {r.get('title')}")
              elif not (floor < t <= ceiling): failures.append(f"out-of-window current record {t.date()}: {r.get('title')}")
              if any(w in str(r.get('status','')).lower() for w in ('terminated','resolved','closed','retracted')): failures.append(f"closed record surfaced as current: {r.get('title')}")
              if r.get('sourceUrl') or r.get('source_url') or r.get('url'): with_evidence+=1
              else: failures.append(f"current record lacks source URL: {r.get('title')}")
          report['currentRecordsWithOfficialEvidence']=with_evidence

          # Independent authoritative completeness check: obtain current ongoing FDA
          # enforcement records directly from openFDA, not from SAFEPLATE.
          official=json.loads((p/'openfda-authoritative.json').read_text()).get('results') or []
          official_current=[]
          for r in official:
              dates=[parse(r.get('report_date')),parse(r.get('recall_initiation_date'))]
              if any(d and floor < d <= ceiling for d in dates):
                  rn=str(r.get('recall_number') or '').strip()
                  if rn: official_current.append(rn)
          if not official: failures.append('independent openFDA snapshot returned zero records')
          if not official_current: failures.append('independent openFDA snapshot produced zero applicable current records')
          safe_ids={str(r.get('id') or '') for r in rows}
          safe_recall_numbers={str(r.get('recallNumber') or r.get('recall_number') or '') for r in rows}
          missing=[rn for rn in official_current if f'FDA-{rn}' not in safe_ids and rn not in safe_recall_numbers]
          report['independentOpenFDA']={'applicableCurrent':len(official_current),'missingFromSafeplate':missing}
          if missing: failures.append(f"authoritative openFDA current records absent from SAFEPLATE API: {', '.join(missing[:10])}")

          report['v18Controls']={'foodSafetyPulse':True,'productSearch':True,'fullscreenMap':True,'evidenceTimeline':True,'explainableRisk':True,'governmentMode':True,'impactDashboard':True}
          report['result']='FAIL' if failures else 'PASS'; report['failures']=failures
          (p/'jean-standard-report.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          if failures: raise SystemExit('JEAN-STANDARD DIAGNOSTIC FAILURES:\n- '+'\n- '.join(failures))
          print(f"JEAN-STANDARD V18 DIAGNOSTIC PASSED: {len(rows)} current recall records validated; {len(official_current)} independent openFDA records matched")
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeplate-jean-standard-${{ github.run_id }}
          path: diagnostic/
          retention-days: 14

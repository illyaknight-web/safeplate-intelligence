name: Harden SAFEPLATE public mobile

on:
  push:
    paths:
      - '.github/workflows/harden-safeplate-public-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Public View for phone release
        run: python scripts/harden_public_mobile.py
      - name: Commit phone hardening
        run: |
          git config user.name 'SAFEPLATE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/public-view-v1.html
          if git diff --cached --quiet; then
            echo 'Public View already hardened.'
          else
            git commit -m 'Harden SAFEPLATE Public View for phones'
            git push origin HEAD:main
          fi

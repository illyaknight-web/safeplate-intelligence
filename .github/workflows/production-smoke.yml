name: SAFEPLATE Production Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'netlify.toml'
      - 'scripts/write-deployment-info.mjs'
      - 'netlify/functions/deployment-info.mjs'
      - 'netlify/functions/system-status.mjs'
      - 'netlify/functions/nass-context.mjs'
      - 'netlify/functions/cdc-foodborne-repair.mjs'
      - 'netlify/functions/noaa-cdo.mjs'
      - 'netlify/functions/surveillance.mjs'
      - 'netlify/functions/external-government-surveillance.mjs'
      - 'netlify/functions/latest-intelligence.mjs'
      - 'netlify/functions/lib/normalize.mjs'
      - 'site/safeplate-shell.html'
      - 'site/public-view-v1.html'
      - 'site/assets/recall-*.jpg'
      - 'site/advanced-intelligence-v16.html'
  schedule:
    - cron: '12,42 * * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for this commit to reach production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://safeplate-intelligence.netlify.app'
          mkdir -p smoke
          deployed=''
          for attempt in $(seq 1 24); do
            curl -sS "$BASE/deployment.json?attempt=$attempt" -o smoke/deployment-info.json || true
            deployed=$(python - <<'PY'
          import json
          try:
              print(json.load(open('smoke/deployment-info.json')).get('commit') or '')
          except Exception:
              print('')
          PY
            )
            echo "Deploy check $attempt: expected ${GITHUB_SHA}, observed ${deployed:-unavailable}"
            [ "$deployed" = "$GITHUB_SHA" ] && break
            sleep 15
          done
          [ "$deployed" = "$GITHUB_SHA" ] || { echo '::error::Production did not reach the workflow commit'; exit 1; }

      - name: Test production APIs and unified UI
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://safeplate-intelligence.netlify.app'
          curl -fsSL "$BASE/" -o smoke/home.html
          curl -fsSL "$BASE/public-view-v1.html" -o smoke/public.html
          curl -fsSL "$BASE/advanced-intelligence-v16.html" -o smoke/advanced.html

          assert_contains() { grep -Fq "$2" "$1" || { echo "::error::$3 was not found in $1"; return 1; }; }
          assert_absent() { ! grep -Fq "$2" "$1" || { echo "::error::$3 unexpectedly found in $1"; return 1; }; }
          assert_contains smoke/home.html 'id="pubBtn"' 'Public View mode button'
          assert_contains smoke/home.html 'id="advBtn"' 'Advanced View mode button'
          assert_contains smoke/home.html 'id="publicFrame"' 'Public frame'
          assert_contains smoke/home.html 'id="advancedFrame"' 'Advanced frame'
          assert_contains smoke/home.html 'safeplate-command-ux' 'Current Advanced UX layer'
          assert_contains smoke/home.html "dispatchEvent(new Event('resize'))" 'Advanced map resize repair'
          assert_contains smoke/home.html '.maplibregl-popup-content' 'Readable map popup repair'
          assert_contains smoke/home.html '#journeyChoices' 'Compact journey choice rail'
          assert_absent smoke/home.html 'window.open(' 'scripted popup navigation'

          assert_contains smoke/advanced.html 'id="heroMap"' 'Advanced hero map'
          assert_contains smoke/advanced.html 'id="journeyMap"' 'Advanced Food Journey map'
          assert_contains smoke/advanced.html 'id="advSearch"' 'Advanced search'
          assert_contains smoke/advanced.html 'id="trackSearch"' 'Track Product search'
          assert_contains smoke/advanced.html 'No invented origins or routes' 'Provenance safeguard'
          assert_contains smoke/advanced.html 'Choose → Play → Verify' 'Food Journey interaction model'
          assert_absent smoke/advanced.html 'Page not found' 'Netlify 404 page'

          assert_contains smoke/public.html 'Know what’s going on with your food.' 'Public-view headline'
          for image in {1..6}; do assert_contains smoke/public.html "public-hero-${image}-release.jpg" "Approved Public image ${image}"; done
          assert_contains smoke/public.html 'object-fit:contain' 'No-crop hero treatment'
          assert_contains smoke/public.html 'id="q"' 'Public safety search input'
          assert_contains smoke/public.html 'id="go"' 'Public safety search action'
          assert_contains smoke/public.html "['Recall date',x.recallDate||verified?.recallDate]" 'Recall-date presentation'
          assert_contains smoke/public.html '/assets/recall-good-gather-mexican-street-corn-trail-mix.jpg' 'Verified product photograph'
          assert_contains smoke/public.html '/assets/recall-taylor-diced-jalapenos.jpg' 'Verified Taylor product label'
          assert_contains smoke/public.html 'id="recentAlertModal"' 'Recent recall popup'
          assert_absent smoke/public.html 'Exact product image not published' 'Oversized missing-photo placeholder'
          assert_contains smoke/public.html 'not</b> a guarantee that the food is safe to consume' 'Truthful no-match safeguard'

          curl -fsSL "$BASE/api/nass-context" -o smoke/nass-context.json
          curl -fsSL "$BASE/api/cdc-foodborne-repair" -o smoke/cdc-repair.json
          curl -fsSL "$BASE/api/system-status" -o smoke/system-status.json
          curl -fsSL "$BASE/api/source-health" -o smoke/source-health.json
          curl -fsSL "$BASE/api/state-coverage" -o smoke/state-coverage.json
          curl -fsSL "$BASE/api/incidents" -o smoke/incidents.json
          curl -fsSL "$BASE/api/surveillance-history" -o smoke/surveillance-history.json
          curl -fsSL "$BASE/api/source-audit" -o smoke/source-audit.json
          curl -fsSL "$BASE/api/latest-intelligence" -o smoke/latest-intelligence.json

          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone
          p=pathlib.Path('smoke')
          load=lambda name: json.loads((p/name).read_text())
          deployment=load('deployment-info.json'); status=load('system-status.json')
          health=load('source-health.json'); coverage=load('state-coverage.json')
          incidents=load('incidents.json'); nass=load('nass-context.json'); cdc=load('cdc-repair.json')
          history=load('surveillance-history.json'); audit=load('source-audit.json'); latest=load('latest-intelligence.json')
          failures=[]
          if deployment.get('commit') != os.environ['GITHUB_SHA']: failures.append('deployed SHA differs from workflow SHA')
          if not status.get('live'): failures.append(f"system-status not live: {status}")
          if status.get('ageMinutes') is None or status.get('ageMinutes',999)>75: failures.append(f"main surveillance stale: {status.get('ageMinutes')}")
          if coverage.get('total') != 51 or coverage.get('checked') != 51: failures.append(f"state coverage checked {coverage.get('checked')}/51")
          rows=incidents.get('incidents',[])
          if not rows: failures.append('no incidents returned')
          sources=health.get('sources',[]) if isinstance(health,dict) else health
          ids={s.get('id'):s for s in sources}
          required=('fda_openfda','usda_fsis','usda_nass_quickstats','cdc_content')
          for source_id in required:
              if source_id not in ids: failures.append(f'missing source-health entry: {source_id}')
              elif not ids[source_id].get('lastChecked'): failures.append(f'source has no lastChecked: {source_id}')
          if nass.get('id')!='usda_nass_quickstats': failures.append(f'NASS endpoint malformed: {nass}')
          if cdc.get('id')!='cdc_content': failures.append(f'CDC endpoint malformed: {cdc}')
          if history.get('configuredCycleMinutes') != 30: failures.append(f"surveillance cycle is {history.get('configuredCycleMinutes')} minutes")
          gaps=history.get('gaps',[])
          if len(gaps)<2 or not all(g.get('withinTolerance') for g in gaps[-2:]): failures.append('recent surveillance history does not prove two clean 30-minute cycles')
          audit_ids={s.get('id'):s for s in audit.get('sources',[])}
          for source_id in ('usda_ams','uk_fsa_alerts','cfia_recalls'):
              if audit_ids.get(source_id,{}).get('executionStatus')!='ONLINE': failures.append(f'{source_id} runtime validation is not ONLINE')
          if not latest.get('latest'): failures.append('latest-intelligence returned no public records')
          report={'checkedAt':datetime.now(timezone.utc).isoformat(),'productionUrl':'https://safeplate-intelligence.netlify.app','expectedSha':os.environ['GITHUB_SHA'],'deployedSha':deployment.get('commit'),'system':status,'incidents':len(rows),'stateCoverage':{k:coverage.get(k) for k in ('scannerVersion','total','checked','online','degraded','lastSync')},'surveillanceHistory':{'configuredCycleMinutes':history.get('configuredCycleMinutes'),'cycleCountRetained':history.get('cycleCountRetained'),'recentGaps':gaps[-2:]},'requiredSources':{k:{x:ids.get(k,{}).get(x) for x in ('status','lastChecked','note')} for k in required},'externalSources':{k:{x:audit_ids.get(k,{}).get(x) for x in ('executionStatus','lastChecked','note')} for k in ('usda_ams','uk_fsa_alerts','cfia_recalls')},'result':'FAIL' if failures else 'PASS','failures':failures}
          (p/'production-proof.json').write_text(json.dumps(report,indent=2)+'\n')
          if failures: raise SystemExit('SMOKE TEST FAILURES:\n- '+'\n- '.join(failures))
          print('SAFEPLATE production smoke test passed')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeplate-production-smoke-${{ github.sha }}
          path: smoke/
          retention-days: 30

name: Repair SAFEPLATE live pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-safeplate-live-pipeline.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected patch target not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old,new,1))

          # 1) Preserve managed early-warning health across the main 30-minute surveillance cycle.
          path='netlify/functions/surveillance.mjs'
          old=''' const state=await getState(),now=new Date().toISOString();\n const health=SOURCE_REGISTRY.filter(Boolean).map(s=>({\n   id:s.id,name:s.name,family:s.family,status:"PENDING",lastChecked:null,\n   note:s.note||(s.active?"Awaiting check":"Connector pending")\n }));\n const active=SOURCE_REGISTRY.filter(Boolean).filter(s=>s.active);'''
          new=''' const state=await getState(),now=new Date().toISOString();\n const previousHealth=new Map((state.sourceHealth||[]).filter(Boolean).map(x=>[x.id,x]));\n const health=SOURCE_REGISTRY.filter(Boolean).map(s=>{\n   const old=previousHealth.get(s.id);\n   if(s.managed && old?.lastChecked){\n     return {...old,id:s.id,name:s.name,family:s.family,note:old.note||s.note||"Managed connector"};\n   }\n   return {id:s.id,name:s.name,family:s.family,status:"PENDING",lastChecked:null,note:s.note||(s.active?"Awaiting check":"Connector pending")};\n });\n const active=SOURCE_REGISTRY.filter(Boolean).filter(s=>s.active);'''
          replace_once(path,old,new)

          # 2) Add official Government of Canada CFIA recall RSS ingestion.
          p=Path(path); s=p.read_text()
          marker='async function pullUKFSA(){'
          if marker not in s: raise SystemExit('UK FSA insertion marker missing')
          cfia=r'''async function pullCFIA(){
 const url="https://recalls-rappels.canada.ca/en/feed/cfia-alerts-recalls";
 const r=await timeoutFetch(url,{accept:"application/rss+xml,application/xml,text/xml;q=0.9,*/*;q=0.8",ms:15000});
 if(!r.ok)throw new Error(`CFIA ${r.status}`);
 const xml=await r.text(),$=cheerio.load(xml,{xmlMode:true}),rows=[];
 $("item").each((_,item)=>{
   const title=cleanText($(item).find("title").first().text());
   const link=cleanText($(item).find("link").first().text());
   const desc=cleanText($(item).find("description").first().text());
   const pub=cleanText($(item).find("pubDate").first().text());
   if(!title||!link)return;
   const id=`CFIA-${fingerprint([title,link,pub])}`;
   const posted=pub?new Date(pub).toISOString():null;
   rows.push({
     id,title,product:title,company:"",hazard:"Food recall / safety alert",
     severity:/listeria|salmonella|e\.?\s*coli|botul|undeclared allergen|metal|glass/i.test(`${title} ${desc}`)?"WATCH":"EMERGING",
     status:"VERIFIED",category:"International food recall",
     states:[],distribution:"Canada",lat:null,lng:null,source:"Government of Canada / CFIA",
     sourcePostedAt:posted,updatedAt:posted||new Date().toISOString(),verifiedAt:posted||new Date().toISOString(),
     summary:desc||title,lots:[],
     evidence:[{type:"AGENCY",status:"VERIFIED",source:"Government of Canada / CFIA",text:desc||title,url:link}],
     entities:[{id:`event-${id}`,type:"Incident",name:title}],links:[],workflowStep:3,rawSource:"cfia_recalls"
   });
 });
 if(!rows.length)throw new Error("CFIA RSS returned 0 recall/alert items");
 return {rows:rows.slice(0,100),note:`${rows.length} official Canada recall/alert items retrieved`};
}

'''
          p.write_text(s.replace(marker,cfia+marker,1))

          # Wire CFIA into the source runner.
          replace_once(path,
              ' if(source.id==="uk_fsa_alerts")return {source,rows:await pullUKFSA()};',
              ' if(source.id==="uk_fsa_alerts")return {source,rows:await pullUKFSA()};\n if(source.id==="cfia_recalls"){const x=await pullCFIA();return {source,...x}};')

          # 3) Fix USA.gov state directory parsing: link text is usually "Alabama (AL)", not exact "Alabama".
          path='netlify/functions/state-scan.mjs'
          replace_once(path,
              'const state=STATES.find(s=>s.toLowerCase()===text.toLowerCase());if(!state)return;',
              'const state=STATES.find(s=>{const a=text.toLowerCase(),b=s.toLowerCase();return a===b||a.startsWith(b+" (")||a.startsWith(b+" ");});if(!state)return;')

          # The background trigger owns scheduling; do not also run the heavyweight scanner as a 30-second scheduled function.
          replace_once(path,'export const config={schedule:"3,33 * * * *"};','export const config={};')

          # 4) Public source health: show executed sources, not roadmap placeholders as fake PENDING sources.
          path='netlify/functions/source-health.mjs'
          p=Path(path); s=p.read_text()
          old=''' const src=(s.sourceHealth?.length?s.sourceHealth.filter(Boolean):SOURCE_REGISTRY.filter(Boolean).map(x=>({\n   id:x.id,name:x.name,family:x.family,status:"PENDING",lastChecked:null,\n   note:x.note||(x.active?"Not checked yet":"Connector pending")\n }))).filter(Boolean);'''
          new=''' const raw=(s.sourceHealth?.length?s.sourceHealth.filter(Boolean):SOURCE_REGISTRY.filter(Boolean).map(x=>({\n   id:x.id,name:x.name,family:x.family,status:"PENDING",lastChecked:null,note:x.note||(x.active?"Not checked yet":"Connector pending")\n }))).filter(Boolean);\n const visibleIds=new Set(SOURCE_REGISTRY.filter(x=>x.display!==false).map(x=>x.id));\n const src=raw.filter(x=>String(x.id||"").startsWith("state_")||x.lastChecked||visibleIds.has(x.id)&&x.status!=="PENDING");'''
          if old not in s: raise SystemExit('source-health patch target missing')
          p.write_text(s.replace(old,new,1))

          # 5) Make imagery self-hosted and visible; add concise visual anchors to public pages.
          path='site/index.html'
          p=Path(path); s=p.read_text()
          s=s.replace("url('https://raw.githubusercontent.com/illyaknight-web/safeplate-intelligence/main/safeplate-function-media-editorial.jpg')","url('/assets/safeplate-editorial.jpg')")
          css_anchor=".hero-art:after{content:'LIVE FOOD INTELLIGENCE';position:absolute;left:28px;bottom:28px;color:white;font-weight:900;letter-spacing:.16em;font-size:12px;text-shadow:0 2px 18px rgba(0,0,0,.45)}"
          css_add=css_anchor+".page-visual{height:230px;border-radius:24px;margin:28px 0 10px;background-size:cover;background-position:center;box-shadow:0 18px 45px rgba(15,23,42,.10);position:relative;overflow:hidden}.page-visual:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,46,26,.05),rgba(6,46,26,.22))}.recall-visual{background-image:url('/assets/safeplate-banner.jpg')}.search-visual{background-image:url('/assets/safeplate-social.jpg')}.journey-visual{background-image:url('/assets/safeplate-brand-card.jpg')}"
          if css_anchor not in s: raise SystemExit('site CSS anchor missing')
          s=s.replace(css_anchor,css_add,1)

          s=s.replace('<section id="recalls" class="screen"><div class="shell"><div class="page-head">','<section id="recalls" class="screen"><div class="shell"><div class="page-head">',1)
          recall_marker='</div><div id="recall-status" class="pill">Checking live sync…</div></div><div class="toolbar">'
          s=s.replace(recall_marker,'</div><div id="recall-status" class="pill">Checking live sync…</div></div><div class="page-visual recall-visual" role="img" aria-label="Fresh food and SAFEPLATE recall intelligence"></div><div class="toolbar">',1)
          search_marker='<section id="search" class="screen"><div class="shell"><div class="page-head"><div><div class="kicker">GROUNDED SEARCH</div><h1>Search SAFEPLATE evidence.</h1><p>Search across the English-language records already loaded by SAFEPLATE.</p></div></div><div class="toolbar">'
          s=s.replace(search_marker,'<section id="search" class="screen"><div class="shell"><div class="page-head"><div><div class="kicker">GROUNDED SEARCH</div><h1>Search SAFEPLATE evidence.</h1><p>Search across the English-language records already loaded by SAFEPLATE.</p></div></div><div class="page-visual search-visual" role="img" aria-label="SAFEPLATE food safety editorial image"></div><div class="toolbar">',1)
          journey_marker='<section id="journey" class="screen"><div class="shell"><div class="page-head"><div><div class="kicker">FOOD JOURNEY</div><h1>Evidence-linked movement.</h1><p>Select a live incident to inspect its known entities and relationships.</p></div></div><div id="journey-output"'
          s=s.replace(journey_marker,'<section id="journey" class="screen"><div class="shell"><div class="page-head"><div><div class="kicker">FOOD JOURNEY</div><h1>Evidence-linked movement.</h1><p>Select a live incident to inspect its known entities and relationships.</p></div></div><div class="page-visual journey-visual" role="img" aria-label="SAFEPLATE food journey editorial image"></div><div id="journey-output"',1)

          # Never show unexecuted roadmap placeholders in the public Source Health table.
          s=s.replace("const feeds=data.sources.filter(s=>!String(s.id||'').startsWith('state_'));","const feeds=data.sources.filter(s=>!String(s.id||'').startsWith('state_')&&s.lastChecked&&s.status!=='PENDING');")
          s=s.replace("status.live?`LIVE · ${status.sourcesOnline} feeds`:(status.stale?'STALE DATA':'SYNC NOT CURRENT')","status.live?`Feeds · ${status.sourcesOnline} online${status.sourceIssues?` · ${status.sourceIssues} issue${status.sourceIssues===1?'':'s'}`:''}`:(status.stale?'STALE DATA':'SYNC NOT CURRENT')")
          p.write_text(s)
          PY

          node --check netlify/functions/surveillance.mjs
          node --check netlify/functions/state-scan.mjs
          node --check netlify/functions/source-health.mjs
          python - <<'PY'
          from pathlib import Path
          s=Path('site/index.html').read_text()
          required=['/assets/safeplate-editorial.jpg','/assets/safeplate-banner.jpg','/assets/safeplate-social.jpg','/assets/safeplate-brand-card.jpg','States · checking 0/51']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'missing site markers: {missing}')
          if "raw.githubusercontent.com/illyaknight-web/safeplate-intelligence/main/safeplate-function-media-editorial.jpg" in s: raise SystemExit('external hero URL still present')
          print('SAFEPLATE production repair validation PASS')
          PY

      - name: Commit production repairs
        shell: bash
        run: |
          git config user.name "safeplate-production-repair"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/surveillance.mjs netlify/functions/state-scan.mjs netlify/functions/source-health.mjs site/index.html
          git commit -m "Fix SAFEPLATE 51-state scan, source health, and public imagery [skip actions]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

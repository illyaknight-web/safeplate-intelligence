name: SAFEPLATE staging runtime evidence

on:
  push:
    branches:
      - safeplate-command-center-staging
    paths:
      - netlify/functions/surveillance.mjs
      - .github/workflows/staging-runtime-smoke.yml

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safeplate-command-center-staging
      - name: Wait for Netlify branch deploy
        run: sleep 75
      - name: Capture real staging runtime evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, time
          base='https://safeplate-command-center-staging--safeplate-intelligence.netlify.app'
          def get(path):
              url=base+path
              last=None
              for _ in range(6):
                  try:
                      with urllib.request.urlopen(url, timeout=35) as r:
                          body=r.read().decode('utf-8','replace')
                          return {'http':r.status,'body':body}
                  except Exception as e:
                      last=repr(e); time.sleep(8)
              return {'http':None,'error':last,'body':''}
          manual=get('/api/manual-sync')
          status=get('/api/system-status')
          health=get('/api/source-health')
          exposed={}
          for p in ['/netlify/functions/surveillance.mjs','/netlify/functions/lib/auth.mjs','/netlify/functions/lib/sources.mjs','/README.md','/.env.example','/REDTEAM_REMEDIATION_v3512.json']:
              try:
                  req=urllib.request.Request(base+p,method='GET')
                  with urllib.request.urlopen(req,timeout=20) as r:
                      exposed[p]=r.status
              except urllib.error.HTTPError as e:
                  exposed[p]=e.code
              except Exception as e:
                  exposed[p]=repr(e)
          def parsed(x):
              try:return json.loads(x.get('body') or '{}')
              except:return {'raw':x.get('body'),'error':x.get('error')}
          result={
            'capturedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'manualSync':{'http':manual.get('http'),'json':parsed(manual)},
            'systemStatus':{'http':status.get('http'),'json':parsed(status)},
            'sourceHealth':{'http':health.get('http'),'json':parsed(health)},
            'publicFileChecks':exposed
          }
          h=result['sourceHealth']['json']
          sources={x.get('id'):x for x in h.get('sources',[]) if isinstance(x,dict)}
          result['checks']={
            'manualSyncOk':result['manualSync']['json'].get('ok') is True,
            'systemLive':result['systemStatus']['json'].get('live') is True,
            'sourcesCheckedAtLeast6':(result['systemStatus']['json'].get('sourcesChecked') or 0)>=6,
            'fdaOutbreaksOnline':sources.get('fda_outbreaks',{}).get('status')=='ONLINE',
            'fsisOnline':sources.get('usda_fsis',{}).get('status')=='ONLINE',
            'protectedFiles404':all(v==404 for v in exposed.values())
          }
          result['allPass']=all(result['checks'].values())
          open('RUNTIME_SMOKE_RESULT.json','w').write(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Commit evidence back to staging branch
        if: always()
        shell: bash
        run: |
          git config user.name "safeplate-runtime-audit"
          git config user.email "actions@users.noreply.github.com"
          git add RUNTIME_SMOKE_RESULT.json
          git commit -m "Record SAFEPLATE staging runtime evidence [skip netlify]" || true
          git pull --rebase origin safeplate-command-center-staging
          git push origin HEAD:safeplate-command-center-staging || true

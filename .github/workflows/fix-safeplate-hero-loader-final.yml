name: Fix SAFEPLATE hero loader final
on:
  push:
    paths:
      - '.github/workflows/fix-safeplate-hero-loader-final.yml'
      - '.github/scripts/fix_safeplate_hero_loader.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pillow
      - run: python .github/scripts/fix_safeplate_hero_loader.py
      - run: |
          git config user.name 'SAFEPLATE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/public-view-v1.html site/assets/public-hero-1.webp site/assets/public-hero-2.webp site/assets/public-hero-3.webp site/assets/public-hero-4.webp site/assets/public-hero-5.webp
          if git diff --cached --quiet; then
            echo 'Already repaired'
          else
            git commit -m 'Install verified SAFEPLATE approved hero images'
            git push origin HEAD:main
          fi

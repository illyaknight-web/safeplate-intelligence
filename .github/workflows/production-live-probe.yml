name: SAFEPLATE production live probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-live-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture production SAFEPLATE state
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, time, re
          base='https://safeplate-intelligence.netlify.app'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'SAFEPLATE-production-probe/2.0','Accept':'application/json,text/plain,*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      return {'http':r.status,'body':r.read().decode('utf-8','replace')}
              except urllib.error.HTTPError as e:
                  return {'http':e.code,'body':e.read().decode('utf-8','replace') if getattr(e,'fp',None) else '','error':str(e)}
              except Exception as e:
                  return {'http':None,'body':'','error':repr(e)}
          def parse(x):
              try:return json.loads(x.get('body') or '{}')
              except:return {'raw':x.get('body'),'error':x.get('error')}

          # Calling system-status also self-heals a missing/stale 51-jurisdiction scan.
          sraw=get('/api/system-status')
          time.sleep(35)
          craw=get('/api/state-coverage')
          hraw=get('/api/source-health')
          iraw=get('/api/incidents')
          s=parse(sraw); c=parse(craw); h=parse(hraw); i=parse(iraw)
          src=[{'id':x.get('id'),'name':x.get('name'),'status':x.get('status'),'note':x.get('note'),'lastChecked':x.get('lastChecked')} for x in h.get('sources',[]) if isinstance(x,dict)]
          rows=i.get('incidents') if isinstance(i,dict) else []
          if rows is None and isinstance(i,list): rows=i
          if rows is None: rows=[]
          def compact(x): return {k:x.get(k) for k in ['id','title','product','company','hazard','severity','status','source','sourcePostedAt','updatedAt','lastObservedAt','summary']}
          terms=['alfalfa','everything sprouts','calco','sprout','blueberry','blueberries']
          matches=[]
          spanish=[]
          raw_html=[]
          spanish_re=re.compile(r'\b(retira|productos|debido|contaminaci[oó]n|aproximadamente|podr[ií]an)\b',re.I)
          for x in rows:
              if not isinstance(x,dict): continue
              hay=' '.join(str(x.get(k) or '') for k in ['title','product','company','hazard','summary','source'])
              low=hay.lower()
              hit=[t for t in terms if t in low]
              if hit:
                  y=compact(x); y['matchedTerms']=hit; matches.append(y)
              if len(spanish_re.findall(hay))>=2: spanish.append(compact(x))
              if re.search(r'<\/?(?:p|strong|a|div|span)\b|&amp;|&lt;|&gt;',hay,re.I): raw_html.append(compact(x))
          non_state=[x for x in src if not str(x.get('id') or '').startswith('state_')]
          online=[x for x in non_state if x.get('status')=='ONLINE']
          issues=[x for x in non_state if x.get('status') in ('DEGRADED','OFFLINE')]
          out={
            'capturedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'http':{'systemStatus':sraw.get('http'),'stateCoverage':craw.get('http'),'sourceHealth':hraw.get('http'),'incidents':iraw.get('http')},
            'systemStatus':s,
            'stateCoverage':c,
            'feedHealth':{'onlineCount':len(online),'issueCount':len(issues),'online':online,'issues':issues},
            'incidentCount':len(rows),
            'languageAudit':{'spanishLikeRecordCount':len(spanish),'rawHtmlRecordCount':len(raw_html),'spanishSamples':spanish[:5],'rawHtmlSamples':raw_html[:5]},
            'blindTest':{'terms':terms,'matchCount':len(matches),'matches':matches[:50]}
          }
          open('PRODUCTION_LIVE_SUMMARY.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "safeplate-production-probe"
          git config user.email "actions@users.noreply.github.com"
          git add PRODUCTION_LIVE_SUMMARY.json
          git commit -m "Record SAFEPLATE production coverage probe [skip netlify]" || true
          git pull --rebase origin main
          git push origin HEAD:main || true

# SAFEPLATE emergency repair completed 2026-09-08; retained as a reproducible meeting-safety repair.
name: Restore shell and lock recalls
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repaired source remains locked
        run: |
          ! grep -q 'Date.now()-400\*864e5' site/public-view-v1.html
          grep -q 'now-45\*864e5' site/public-view-v1.html
          grep -q 'now-45\*864e5' site/shell-v2.js
          ! grep -qi 'good & gather mexican street corn trail mix' site/public-view-v1.html
          grep -q 'function tuneAdvanced' site/safeplate-shell.html

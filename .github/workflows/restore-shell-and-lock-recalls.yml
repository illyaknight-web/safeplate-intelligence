name: Fix Public current recall dialog
on:
  push:
    paths:
      - '.github/workflows/restore-shell-and-lock-recalls.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-public-recalls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove photo-only recall gate and preserve 45-day rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site/public-view-v1.html')
          s=p.read_text()
          replacements={
            "(raw.startsWith('state_')&&productImage(x)&&/\\brecall\\b/i.test(t))":"(raw.startsWith('state_')&&/\\brecall\\b/i.test(t))",
            "async function openPicturedRecallDialog(auto=false){await load();const box=document.getElementById('currentRecallItems'),current=rows.filter(x=>isCurrent(x)&&isRecallEvent(x)&&productImage(x)).sort((a,b)=>recordDate(b)-recordDate(a)).slice(0,6);box.innerHTML=current.length?current.map(recallDialogItem).join(''):'<div class=\"notice\"><strong>No current recall with a verified product photograph is available.</strong><br>SAFEPLATE will not use a generic or invented image for an exact recalled product.</div>';document.getElementById('currentRecallDialog').hidden=false;if(auto)sessionStorage.setItem('safeplate-recall-window-seen','1')}":"async function openCurrentRecallDialog(auto=false){await load();const box=document.getElementById('currentRecallItems'),current=rows.filter(x=>isCurrent(x)&&isRecallEvent(x)).sort((a,b)=>recordDate(b)-recordDate(a)).slice(0,6);box.innerHTML=current.length?current.map(recallDialogItem).join(''):'<div class=\"notice\"><strong>No current verified recall records are available.</strong><br>SAFEPLATE will not substitute unrelated or historical records.</div>';document.getElementById('currentRecallDialog').hidden=false;if(auto)sessionStorage.setItem('safeplate-recall-window-seen','1')}",
            "document.getElementById('alertStripOpen').onclick=()=>openPicturedRecallDialog();":"document.getElementById('alertStripOpen').onclick=()=>openCurrentRecallDialog();",
            "setTimeout(()=>openPicturedRecallDialog(true),700)":"setTimeout(()=>openCurrentRecallDialog(true),700)",
            "current federal recall record":"current verified recall record"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected source fragment missing; refusing unsafe edit: {old[:90]}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify meeting-critical recall behavior
        run: |
          grep -q 'now-45\*864e5' site/public-view-v1.html
          ! grep -q 'Date.now()-400\*864e5' site/public-view-v1.html
          ! grep -q 'openPicturedRecallDialog' site/public-view-v1.html
          grep -q 'openCurrentRecallDialog' site/public-view-v1.html
          ! grep -Fq "isRecallEvent(x)&&productImage(x)" site/public-view-v1.html
          ! grep -Fq "raw.startsWith('state_')&&productImage(x)" site/public-view-v1.html
          grep -Fq 'Official product image not published' site/public-view-v1.html
          ! grep -qi 'good & gather mexican street corn trail mix' site/public-view-v1.html
      - name: Commit source fix
        run: |
          git config user.name 'SAFEPLATE release repair'
          git config user.email 'actions@users.noreply.github.com'
          git add site/public-view-v1.html
          git commit -m 'Show all current verified recalls regardless of photo availability'
          git push

name: SAFEPLATE USDA FSIS runtime hardening

on:
  push:
    branches:
      - safeplate-command-center-staging
    paths:
      - .github/workflows/fsis-runtime-fix.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safeplate-command-center-staging
      - name: Harden FSIS bridge consumption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/surveillance.mjs')
          s=p.read_text()
          old=''' const payload=await bridge.json();\n const raw=Array.isArray(payload)?payload:(payload.records||[]);\n const normalized=raw.slice(0,300).map(normalizeFSIS);\n if(!normalized.length)throw new Error("FSIS authoritative bridge returned 0 records");\n const capturedAt=Array.isArray(payload)?null:payload.capturedAt;\n return {rows:normalized,note:`${normalized.length} records from official FSIS Recall API via SAFEPLATE GitHub bridge${capturedAt?` (captured ${capturedAt})`:""}`};'''
          new=''' const payload=await bridge.json();\n const raw=Array.isArray(payload)?payload:(payload.records||[]);\n // GovDelivery's broad FSIS news feed can include non-recall press releases.\n // Only treat actual recalls/public-health alerts as FSIS incident records.\n const recallRows=raw.filter(x=>/\\b(?:recall|public health alert)\\b/i.test(`${x?.field_title||x?.title||""} ${x?.field_reason_for_recall||x?.description||""}`));\n const normalized=recallRows.slice(0,300).map(normalizeFSIS);\n if(!normalized.length)throw new Error("FSIS authoritative bridge returned 0 recall/public-health-alert records");\n const capturedAt=Array.isArray(payload)?null:payload.capturedAt;\n const sourceType=Array.isArray(payload)?"USDA/FSIS bridge":(payload.sourceType||"USDA/FSIS authoritative publication bridge");\n return {rows:normalized,note:`${normalized.length} recall/public-health-alert records from ${sourceType}${capturedAt?` (captured ${capturedAt})`:""}`};'''
          if old not in s:
              raise SystemExit('FSIS bridge block not found; refusing unsafe patch')
          p.write_text(s.replace(old,new))
          PY
          node --check netlify/functions/surveillance.mjs
          git config user.name "safeplate-fsis-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/surveillance.mjs
          git commit -m "Harden USDA FSIS authoritative bridge handling"
          git pull --rebase origin safeplate-command-center-staging
          git push origin HEAD:safeplate-command-center-staging

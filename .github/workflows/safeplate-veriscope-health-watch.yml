name: SAFEPLATE + VERISCOPE 10-Minute Health Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/safeplate-veriscope-health-watch.yml'
      - 'netlify/functions/platform-health.mjs'
      - 'netlify/functions/system-status.mjs'
      - 'netlify/functions/veriscope-bridge-status.mjs'
      - 'netlify/functions/veriscope-bridge-scheduled.mjs'
      - 'netlify/functions/lib/veriscope-bridge.mjs'
      - 'netlify/functions/lib/store.mjs'

permissions:
  contents: read

jobs:
  health-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live SAFEPLATE and VERISCOPE health
        shell: bash
        run: |
          set -u
          BASE='https://safeplate-intelligence.netlify.app'
          mkdir -p health

          code=$(curl --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 --output health/platform-health.json --write-out '%{http_code}' "$BASE/api/platform-health?ts=$(date +%s)" || true)
          printf '%s' "$code" > health/platform-health.status
          echo "platform-health HTTP $code"

          python - <<'PY'
          import json
          from pathlib import Path

          code=(Path('health')/'platform-health.status').read_text().strip()
          body=(Path('health')/'platform-health.json').read_text(errors='replace') if (Path('health')/'platform-health.json').exists() else ''

          if code != '200':
              try:
                  payload=json.loads(body)
              except Exception:
                  payload={}
              if payload.get('error')=='usage_exceeded':
                  print('SAFEPLATE / VERISCOPE HEALTH WATCH FAILED')
                  print(' - Netlify function usage quota is exhausted (usage_exceeded).')
                  print(' - SAFEPLATE and VERISCOPE function execution cannot be certified until Netlify usage is restored.')
              else:
                  print('SAFEPLATE / VERISCOPE HEALTH WATCH FAILED')
                  print(f' - Consolidated platform-health endpoint returned HTTP {code or "unavailable"}.')
                  if body:
                      print(f' - Response: {body[:500]}')
              raise SystemExit(1)

          try:
              health=json.loads(body)
          except Exception as exc:
              print(f'SAFEPLATE / VERISCOPE HEALTH WATCH FAILED\n - platform-health returned invalid JSON: {exc}')
              raise SystemExit(1)

          failures=[]
          deployment=health.get('deployment') or {}
          safeplate=health.get('safeplate') or {}
          veriscope=health.get('veriscope') or {}

          commit=deployment.get('commit')
          if not commit or len(str(commit)) != 40:
              failures.append(f'Production deployment identity unavailable: {commit!r}')
          if not safeplate.get('live'):
              failures.append(f"SAFEPLATE surveillance not live: ageMinutes={safeplate.get('ageMinutes')}")

          critical=safeplate.get('criticalSources') or {}
          if critical.get('ageMinutes') is None or critical.get('ageMinutes') > 35:
              failures.append(f"Critical-source surveillance stale: ageMinutes={critical.get('ageMinutes')}")

          early=safeplate.get('earlyWarning') or {}
          if not early.get('live'):
              failures.append(f"SAFEPLATE early-warning stale: ageMinutes={early.get('ageMinutes')}")

          state=safeplate.get('stateSurveillance') or {}
          if not state.get('live'):
              failures.append(f"State surveillance not live: checked={state.get('checked')}/{state.get('total')} scanner={state.get('scannerVersion')}")

          if veriscope.get('status') not in {'SHADOW_NO_CHANGES','SHADOW_DELIVERED'}:
              failures.append(f"VERISCOPE bridge unhealthy: status={veriscope.get('status')}")
          if veriscope.get('ageMinutes') is None or veriscope.get('ageMinutes') > 35:
              failures.append(f"VERISCOPE bridge stale: ageMinutes={veriscope.get('ageMinutes')}")
          if veriscope.get('error'):
              failures.append(f"VERISCOPE bridge error: {veriscope.get('error')}")

          if failures or not health.get('healthy'):
              print('SAFEPLATE / VERISCOPE HEALTH WATCH FAILED')
              for item in failures:
                  print(f' - {item}')
              raise SystemExit(1)

          print('SAFEPLATE / VERISCOPE HEALTH WATCH PASSED')
          print(f'Production commit: {commit}')
          print(f"SAFEPLATE surveillance age: {safeplate.get('ageMinutes')} minutes")
          print(f"VERISCOPE status: {veriscope.get('status')}; age: {veriscope.get('ageMinutes')} minutes")
          PY

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeplate-veriscope-health-${{ github.run_id }}
          path: health/
          retention-days: 14

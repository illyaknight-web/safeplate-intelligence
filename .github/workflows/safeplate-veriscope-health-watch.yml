name: SAFEPLATE + VERISCOPE 10-Minute Health Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/safeplate-veriscope-health-watch.yml'
      - 'netlify/functions/deployment-info.mjs'
      - 'netlify/functions/system-status.mjs'
      - 'netlify/functions/veriscope-bridge-status.mjs'
      - 'netlify/functions/veriscope-bridge-scheduled.mjs'
      - 'netlify/functions/lib/veriscope-bridge.mjs'

permissions:
  contents: read

jobs:
  health-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live SAFEPLATE and VERISCOPE health
        shell: bash
        run: |
          set -u
          BASE='https://safeplate-intelligence.netlify.app'
          mkdir -p health

          fetch() {
            name="$1"
            path="$2"
            code=$(curl --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 --output "health/${name}.json" --write-out '%{http_code}' "$BASE${path}?ts=$(date +%s)" || true)
            printf '%s' "$code" > "health/${name}.status"
            echo "$name HTTP $code"
          }

          fetch deployment '/api/deployment-info'
          fetch system-status '/api/system-status'
          fetch veriscope '/api/veriscope-bridge-status'

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          failures=[]

          def status(name):
              return (Path('health')/f'{name}.status').read_text().strip()

          def load(name):
              code=status(name)
              if code != '200':
                  failures.append(f'{name} endpoint returned HTTP {code or "unavailable"}')
                  return {}
              try:
                  return json.loads((Path('health')/f'{name}.json').read_text())
              except Exception as exc:
                  failures.append(f'{name} endpoint returned invalid JSON: {exc}')
                  return {}

          deployment=load('deployment')
          system=load('system-status')
          veriscope=load('veriscope')

          commit=deployment.get('commit')
          if deployment and (not commit or len(str(commit)) != 40):
              failures.append(f'Production deployment identity unavailable: {commit!r}')

          if system:
              if not system.get('live'):
                  failures.append('SAFEPLATE system-status is not live')
              age=system.get('ageMinutes')
              if age is None or age > 60:
                  failures.append(f'SAFEPLATE surveillance stale: ageMinutes={age}')

              critical=system.get('criticalSources') or {}
              critical_age=critical.get('ageMinutes')
              if critical_age is None or critical_age > 35:
                  failures.append(f'Critical-source surveillance stale: ageMinutes={critical_age}')

              early=system.get('earlyWarning') or {}
              if not early.get('live'):
                  failures.append('SAFEPLATE early-warning layer is not live')
              early_age=early.get('ageMinutes')
              if early_age is None or early_age > 60:
                  failures.append(f'Early-warning surveillance stale: ageMinutes={early_age}')

              state=system.get('stateSurveillance') or {}
              if not state.get('live'):
                  failures.append(f"State surveillance not live: checked={state.get('jurisdictionsChecked')}/51 scanner={state.get('scannerVersion')}")
          else:
              age=None

          bridge_status=veriscope.get('status') if veriscope else None
          completed=veriscope.get('lastCycleCompletedAt') if veriscope else None
          if veriscope:
              healthy={'SHADOW_NO_CHANGES','SHADOW_DELIVERED'}
              if bridge_status not in healthy:
                  failures.append(f'VERISCOPE bridge unhealthy: status={bridge_status}')
              if veriscope.get('error'):
                  failures.append(f"VERISCOPE bridge error: {veriscope.get('error')}")
              if not completed:
                  failures.append('VERISCOPE has no completed bridge cycle')
              else:
                  try:
                      dt=datetime.fromisoformat(str(completed).replace('Z','+00:00')).astimezone(timezone.utc)
                      minutes=(datetime.now(timezone.utc)-dt).total_seconds()/60
                      if minutes>35:
                          failures.append(f'VERISCOPE bridge stale: last completed {minutes:.1f} minutes ago')
                  except Exception:
                      failures.append(f'VERISCOPE completion time is invalid: {completed}')

          if failures:
              print('SAFEPLATE / VERISCOPE HEALTH WATCH FAILED')
              for item in failures:
                  print(f' - {item}')
              raise SystemExit(1)

          print('SAFEPLATE / VERISCOPE HEALTH WATCH PASSED')
          print(f'Production commit: {commit}')
          print(f'SAFEPLATE surveillance age: {age} minutes')
          print(f'VERISCOPE status: {bridge_status}; last cycle: {completed}')
          PY

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeplate-veriscope-health-${{ github.run_id }}
          path: health/
          retention-days: 14

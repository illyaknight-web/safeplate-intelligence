name: SAFEPLATE Public Image Live Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'netlify.toml'
      - 'site/public-view-v1.html'
      - 'site/safeplate-shell.html'
      - 'site/advanced-intelligence-v16.html'
      - 'site/assets/public-hero-*-release.jpg'
      - 'site/assets/recall-*.jpg'
      - 'site/assets/public-image-manifest.json'
      - 'scripts/verify_public_release_images.py'
      - 'scripts/write-deployment-info.mjs'
      - '.github/workflows/public-image-live-smoke.yml'
  schedule:
    - cron: '18,48 * * * *'

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify approved images on the deployed commit
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://safeplate-intelligence.netlify.app'
          mkdir -p smoke/assets
          deployed=''
          for attempt in $(seq 1 24); do
            curl -sS "$BASE/deployment.json?attempt=$attempt" -o smoke/deployment-info.json || true
            deployed=$(python - <<'PY'
          import json
          try:
              print(json.load(open('smoke/deployment-info.json')).get('commit') or '')
          except Exception:
              print('')
          PY
            )
            echo "Deploy check $attempt: expected ${GITHUB_SHA}, observed ${deployed:-unavailable}"
            [ "$deployed" = "$GITHUB_SHA" ] && break
            sleep 15
          done
          [ "$deployed" = "$GITHUB_SHA" ] || { echo '::error::Production did not reach the workflow commit'; exit 1; }

          curl -fsS "$BASE/assets/public-image-manifest.json?sha=$GITHUB_SHA" -o smoke/manifest.json
          for image in {1..6}; do curl -fsS "$BASE/assets/public-hero-${image}-release.jpg?sha=$GITHUB_SHA" -o "smoke/assets/public-hero-${image}-release.jpg"; done
          python scripts/verify_public_release_images.py --manifest smoke/manifest.json --assets smoke/assets --report smoke/image-proof.json
          curl -fsS "$BASE/assets/recall-good-gather-mexican-street-corn-trail-mix.jpg?sha=$GITHUB_SHA" -o smoke/assets/recall-good-gather-mexican-street-corn-trail-mix.jpg
          curl -fsS "$BASE/assets/recall-taylor-diced-jalapenos.jpg?sha=$GITHUB_SHA" -o smoke/assets/recall-taylor-diced-jalapenos.jpg
          python - <<'PY'
          from PIL import Image
          expected={
            'smoke/assets/recall-good-gather-mexican-street-corn-trail-mix.jpg':(600,600),
            'smoke/assets/recall-taylor-diced-jalapenos.jpg':(900,496),
          }
          for p,size in expected.items():
            with Image.open(p) as image: image.verify()
            with Image.open(p) as image: assert image.size == size,(p,image.size)
          PY

          curl -fsS "$BASE/public-view-v1.html?sha=$GITHUB_SHA" -o smoke/public.html
          grep -Fq 'Know what’s going on with your food.' smoke/public.html
          for image in {1..6}; do grep -Fq "/assets/public-hero-${image}-release.jpg" smoke/public.html; done
          grep -Fq '/assets/recall-good-gather-mexican-street-corn-trail-mix.jpg' smoke/public.html
          grep -Fq '/assets/recall-taylor-diced-jalapenos.jpg' smoke/public.html
          grep -Fq "['Recall date',x.recallDate||verified?.recallDate]" smoke/public.html
          grep -Fq 'id="recentAlertModal"' smoke/public.html
          grep -Fq 'Recent recalls &amp; food alerts' smoke/public.html
          grep -Fq 'humanRoot' smoke/public.html
          grep -Fq 'Food warnings on your phone.' smoke/public.html
          grep -Fq 'id="foodInformation"' smoke/public.html
          grep -Fq 'FOOD_GUIDES' smoke/public.html
          grep -Fq 'cold-food-storage-charts' smoke/public.html
          grep -Fq 'selecting-and-serving-produce-safely' smoke/public.html
          ! grep -Fq 'Exact product image not published' smoke/public.html
          grep -Fq '.pic img{width:100%;height:100%;display:block;object-fit:contain' smoke/public.html
          ! grep -Eq 'public-(main|recall|fresh|store|cook|journey)-v3|public-hero-[1-5]-confirmed|public-hero-[1-5]\.webp' smoke/public.html
          echo 'SAFEPLATE approved Public image smoke PASSED'

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeplate-public-image-smoke-${{ github.sha }}
          path: smoke/
          retention-days: 30

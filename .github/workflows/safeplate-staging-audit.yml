name: SAFEPLATE staging runtime audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/safeplate-staging-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for staging deploy
        run: sleep 30

      - name: Audit SAFEPLATE staging runtime
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, time, sys

          base='https://safeplate-command-center-staging--safeplate-intelligence.netlify.app'

          def fetch(path, retries=4):
              last=''
              for _ in range(retries):
                  try:
                      req=urllib.request.Request(
                          base+path,
                          headers={'User-Agent':'SAFEPLATE-runtime-audit/1.1','Accept':'application/json,text/plain,*/*'}
                      )
                      with urllib.request.urlopen(req, timeout=40) as r:
                          return {'http':r.status,'body':r.read().decode('utf-8','replace')}
                  except urllib.error.HTTPError as e:
                      body=e.read().decode('utf-8','replace') if getattr(e,'fp',None) else ''
                      return {'http':e.code,'body':body,'error':str(e)}
                  except Exception as e:
                      last=repr(e)
                      time.sleep(8)
              return {'http':None,'body':'','error':last}

          def parse(x):
              try:
                  return json.loads(x.get('body') or '{}')
              except Exception:
                  return {'raw':x.get('body'),'error':x.get('error')}

          manual=fetch('/api/manual-sync')
          time.sleep(3)
          status=fetch('/api/system-status')
          health=fetch('/api/source-health')

          m,s,h=parse(manual),parse(status),parse(health)
          src={x.get('id'):x for x in h.get('sources',[]) if isinstance(x,dict)}

          checks={
              'manualSyncHttpOk': manual.get('http') in (200,202),
              'systemStatusHttpOk': status.get('http') == 200,
              'sourceHealthHttpOk': health.get('http') == 200,
              'systemLive': s.get('live') is True,
              'sourcesCheckedAtLeast6': (s.get('sourcesChecked') or 0) >= 6,
              'fdaOutbreaksOnline': src.get('fda_outbreaks',{}).get('status') == 'ONLINE',
              'fsisOnline': src.get('usda_fsis',{}).get('status') == 'ONLINE'
          }

          result={
              'capturedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
              'manualSync':{'http':manual.get('http'),'json':m},
              'systemStatus':{'http':status.get('http'),'json':s},
              'sourceHealth':{'http':health.get('http'),'json':h},
              'checks':checks,
              'allPass':all(checks.values())
          }

          print(json.dumps(result,indent=2))

          if not result['allPass']:
              failed=[k for k,v in checks.items() if not v]
              print('FAILED CHECKS:', ', '.join(failed), file=sys.stderr)
              sys.exit(1)
          PY

name: SAFEPLATE staging runtime audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/safeplate-staging-audit.yml

permissions:
  contents: write

jobs:
  audit-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safeplate-command-center-staging
      - name: Repair FSIS connector with federal RSS fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/surveillance.mjs')
          s=p.read_text()
          start=s.index('async function pullFSIS(){')
          end=s.index('\nfunction cleanText',start)
          new=r'''async function pullFSIS(){
 const apiUrl="https://www.fsis.usda.gov/fsis/api/recall/v/1";
 const api=await timeoutFetch(apiUrl,{accept:"application/json,text/plain;q=0.9,*/*;q=0.8",headers:{referer:"https://www.fsis.usda.gov/science-data/developer-resources/recall-api"}});
 if(api.ok){
   const j=await api.json();
   const rows=Array.isArray(j)?j:(j.results||j.data||j.rows||[]);
   const normalized=rows.slice(0,200).map(normalizeFSIS);
   return {rows:normalized,note:`${normalized.length} records retrieved from official FSIS Recall API`};
 }
 let webError=null;
 try{
   const {response:r,url}=await firstSuccessfulFetch([
     "https://www.fsis.usda.gov/recalls",
     "https://www.fsis.usda.gov/food-safety/alerts"
   ],{accept:"text/html,application/xhtml+xml",headers:{referer:"https://www.fsis.usda.gov/"}});
   const html=await r.text(),$=cheerio.load(html),seen=new Set(),rows=[];
   $("a[href*='/recalls-alerts/']").each((_,a)=>{
     const title=cleanText($(a).text());
     const href=$(a).attr("href")||"";
     if(title.length<20||!href)return;
     const full=new URL(href,url).toString();
     if(seen.has(full))return;seen.add(full);
     const block=$(a).closest("article,.views-row,.node,.usa-card,.view-content>div").first();
     const text=cleanText(block.length?block.text():$(a).parent().parent().text());
     const rid=(text.match(/\b(?:PHA-\d{8}-\d+|\d{3}-\d{4})\b/i)||[])[0]||fingerprint([title,full]);
     const classification=(text.match(/Class\s+(?:I{1,3})\b/i)||[])[0]||"";
     rows.push(normalizeFSIS({field_recall_number:rid,field_title:title,field_reason_for_recall:text.slice(0,1200),field_recall_classification:classification,field_states:/\bNationwide\b/i.test(text)?"Nationwide":"",field_recall_url:full,field_recall_date:(text.match(/(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun),?\s+[A-Z][a-z]{2}\s+\d{1,2},\s+\d{4}/)||[])[0]||null}));
   });
   if(rows.length)return {rows:rows.slice(0,100),note:`${rows.slice(0,100).length} records retrieved from official FSIS web fallback after API ${api.status}`};
 }catch(e){webError=String(e.message||e)}
 const cdcUrl="https://www2c.cdc.gov/podcasts/createrss.asp?c=146";
 const cdc=await timeoutFetch(cdcUrl,{accept:"application/rss+xml,application/xml,text/xml,*/*;q=0.8",headers:{referer:"https://catalog.data.gov/dataset/food-safety-information-rss-feed"}});
 if(cdc.ok){
   const xml=await cdc.text(),$=cheerio.load(xml,{xmlMode:true}),seen=new Set(),rows=[];
   $("item").each((_,item)=>{
     const title=cleanText($(item).find("title").first().text());
     const link=cleanText($(item).find("link").first().text());
     const guid=cleanText($(item).find("guid").first().text());
     const rawDesc=$(item).find("description").first().text()||"";
     const desc=cleanText(rawDesc.replace(/<[^>]+>/g," "));
     const pubDate=cleanText($(item).find("pubDate").first().text());
     const marker=`${link} ${guid} ${title} ${desc}`;
     if(!/(fsis\.usda\.gov|Food Safety and Inspection Service|\bFSIS\b|\bUSDA\b)/i.test(marker))return;
     const sourceUrl=link||guid;
     if(sourceUrl&&seen.has(sourceUrl))return;
     if(sourceUrl)seen.add(sourceUrl);
     const text=cleanText(`${title} ${desc}`);
     const rid=(text.match(/\b(?:PHA-\d{8}-\d+|\d{3}-\d{4})\b/i)||[])[0]||fingerprint([title,sourceUrl,pubDate]);
     const classification=(text.match(/Class\s+(?:I{1,3})\b/i)||[])[0]||"";
     rows.push(normalizeFSIS({field_recall_number:rid,field_title:title||"USDA FSIS recall / public health alert",field_reason_for_recall:desc||title,field_recall_classification:classification,field_states:/\bNationwide\b/i.test(text)?"Nationwide":"",field_recall_url:sourceUrl||"https://www.foodsafety.gov/recalls-and-outbreaks",field_recall_date:pubDate||null}));
   });
   if(rows.length)return {rows:rows.slice(0,100),note:`${rows.slice(0,100).length} USDA/FSIS notices retrieved through CDC/HHS federal Food Safety RSS after direct FSIS ${api.status}`};
 }
 throw new Error(`FSIS direct access ${api.status}; web fallback ${webError||"no rows"}; CDC/HHS federal RSS ${cdc.status}`);
}
'''
          p.write_text(s[:start]+new+s[end:])
          PY
          node --check netlify/functions/surveillance.mjs
          git config user.name "safeplate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/surveillance.mjs
          git commit -m "Repair FSIS with CDC HHS federal RSS fallback" || true
          git pull --rebase origin safeplate-command-center-staging
          git push origin HEAD:safeplate-command-center-staging
      - name: Wait for Netlify staging deploy
        run: sleep 90
      - name: Run and record staging runtime audit
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, time
          base='https://safeplate-command-center-staging--safeplate-intelligence.netlify.app'
          def fetch(path, retries=6):
              last=''
              for _ in range(retries):
                  try:
                      req=urllib.request.Request(base+path,headers={'User-Agent':'SAFEPLATE-runtime-audit/1.0'})
                      with urllib.request.urlopen(req,timeout=40) as r:return {'http':r.status,'body':r.read().decode('utf-8','replace')}
                  except urllib.error.HTTPError as e:
                      body=e.read().decode('utf-8','replace') if getattr(e,'fp',None) else ''
                      return {'http':e.code,'body':body,'error':str(e)}
                  except Exception as e:last=repr(e);time.sleep(10)
              return {'http':None,'body':'','error':last}
          manual=fetch('/api/manual-sync');time.sleep(3);status=fetch('/api/system-status');health=fetch('/api/source-health')
          protected={p:fetch(p,2).get('http') for p in ['/netlify/functions/surveillance.mjs','/netlify/functions/lib/auth.mjs','/netlify/functions/lib/sources.mjs','/README.md','/.env.example','/REDTEAM_REMEDIATION_v3512.json']}
          def parse(x):
              try:return json.loads(x.get('body') or '{}')
              except:return {'raw':x.get('body'),'error':x.get('error')}
          m,s,h=parse(manual),parse(status),parse(health);src={x.get('id'):x for x in h.get('sources',[]) if isinstance(x,dict)}
          result={'capturedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'manualSync':{'http':manual.get('http'),'json':m},'systemStatus':{'http':status.get('http'),'json':s},'sourceHealth':{'http':health.get('http'),'json':h},'publicFileChecks':protected,'checks':{'manualSyncOk':m.get('ok') is True,'systemLive':s.get('live') is True,'sourcesCheckedAtLeast6':(s.get('sourcesChecked') or 0)>=6,'fdaOutbreaksOnline':src.get('fda_outbreaks',{}).get('status')=='ONLINE','fsisOnline':src.get('usda_fsis',{}).get('status')=='ONLINE','protectedFiles404':all(v==404 for v in protected.values())}}
          result['allPass']=all(result['checks'].values());open('RUNTIME_SMOKE_RESULT.json','w').write(json.dumps(result,indent=2));print(json.dumps(result,indent=2))
          PY
      - name: Commit runtime evidence to staging branch
        if: always()
        shell: bash
        run: |
          git config user.name "safeplate-runtime-audit"
          git config user.email "actions@users.noreply.github.com"
          git add RUNTIME_SMOKE_RESULT.json
          git commit -m "Record SAFEPLATE staging runtime evidence [skip netlify]" || true
          git pull --rebase origin safeplate-command-center-staging
          git push origin HEAD:safeplate-command-center-staging

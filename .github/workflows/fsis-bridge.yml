name: SAFEPLATE USDA FSIS bridge

on:
  push:
    branches:
      - safeplate-command-center-staging
    paths:
      - .github/workflows/fsis-bridge.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-fsis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safeplate-command-center-staging

      - name: Fetch authoritative FSIS recall data
        shell: bash
        run: |
          python - <<'PY'
          import json, re, sys, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          OUT=Path('data/fsis-recalls.json')
          OUT.parent.mkdir(parents=True, exist_ok=True)

          UA='SAFEPLATE-FSIS-Bridge/1.0 (+https://safeplate-intelligence.netlify.app)'
          attempts=[]

          def get(url, accept='*/*'):
              req=urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Accept': accept,
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Referer': 'https://www.fsis.usda.gov/science-data/developer-resources/recall-api'
              })
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, r.geturl(), r.read()
              except urllib.error.HTTPError as e:
                  body=e.read() if getattr(e,'fp',None) else b''
                  attempts.append({'url':url,'http':e.code,'error':str(e),'bytes':len(body)})
              except Exception as e:
                  attempts.append({'url':url,'http':None,'error':repr(e)})
              return None, url, b''

          # 1) Official FSIS Recall API.
          api='https://www.fsis.usda.gov/fsis/api/recall/v/1'
          status, final, body=get(api,'application/json,text/plain;q=0.9,*/*;q=0.8')
          if status and 200 <= status < 300:
              try:
                  j=json.loads(body.decode('utf-8','replace'))
                  rows=j if isinstance(j,list) else (j.get('results') or j.get('data') or j.get('rows') or [])
                  if rows:
                      payload={
                          'capturedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
                          'authority':'USDA Food Safety and Inspection Service',
                          'sourceType':'FSIS Recall API',
                          'sourceUrl':final,
                          'records':rows[:500]
                      }
                      OUT.write_text(json.dumps(payload,indent=2))
                      print(f'FSIS bridge: {len(payload["records"])} records from official API')
                      sys.exit(0)
              except Exception as e:
                  attempts.append({'url':api,'http':status,'error':'JSON parse: '+repr(e)})

          # 2) Official FSIS RSS; 3) CDC/HHS combined federal food-safety feed,
          # which Data.gov documents as integrating the FSIS recall XML feed.
          feeds=[
              'https://www.fsis.usda.gov/RSS/usdarss.xml',
              'http://www.fsis.usda.gov/RSS/usdarss.xml',
              'https://www2c.cdc.gov/podcasts/createrss.asp?c=146',
              'http://www2c.cdc.gov/podcasts/createrss.asp?c=146'
          ]

          def txt(el, names):
              for name in names:
                  v=el.findtext(name)
                  if v and v.strip(): return v.strip()
              return ''

          def clean(s):
              return re.sub(r'<[^>]+>',' ',s or '').replace('&nbsp;',' ').strip()

          for feed in feeds:
              status, final, body=get(feed,'application/rss+xml,application/xml,text/xml;q=0.9,*/*;q=0.8')
              if not status or not (200 <= status < 300) or not body:
                  continue
              try:
                  root=ET.fromstring(body)
              except Exception as e:
                  attempts.append({'url':feed,'http':status,'error':'XML parse: '+repr(e)})
                  continue

              items=root.findall('.//item')
              records=[]
              for item in items:
                  title=txt(item,['title'])
                  link=txt(item,['link','guid'])
                  desc=clean(txt(item,['description','summary']))
                  combined=' '.join([title,link,desc])

                  # On the CDC/HHS combined feed retain only FSIS/USDA-origin items.
                  if 'cdc.gov/podcasts' in final.lower() or 'www2c.cdc.gov' in final.lower():
                      if not (re.search(r'fsis|usda|food safety and inspection service',combined,re.I) or 'fsis.usda.gov' in link.lower()):
                          continue

                  number=(re.search(r'\b(?:PHA-\d{8}-\d+|\d{3}-\d{4})\b',combined,re.I) or [None])[0]
                  classification=(re.search(r'Class\s+(?:I{1,3})\b',combined,re.I) or [None])[0]
                  states='Nationwide' if re.search(r'\bNationwide\b',combined,re.I) else ''
                  pub=txt(item,['pubDate','date'])
                  records.append({
                      'field_recall_number': number or re.sub(r'\W+','-',title.lower()).strip('-')[:80],
                      'field_title': title or 'USDA FSIS recall/public health alert',
                      'field_reason_for_recall': desc or title,
                      'field_recall_classification': classification or '',
                      'field_states': states,
                      'field_recall_url': link or final,
                      'field_recall_date': pub
                  })

              if records:
                  payload={
                      'capturedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
                      'authority':'USDA Food Safety and Inspection Service',
                      'sourceType':'FSIS RSS' if 'fsis.usda.gov' in final.lower() else 'CDC/HHS integrated federal food-safety RSS (FSIS-filtered)',
                      'sourceUrl':final,
                      'records':records[:500],
                      'attempts':attempts
                  }
                  OUT.write_text(json.dumps(payload,indent=2))
                  print(f'FSIS bridge: {len(payload["records"])} USDA/FSIS records via {payload["sourceType"]}')
                  sys.exit(0)

          print(json.dumps({'error':'No authoritative FSIS source returned usable records','attempts':attempts},indent=2),file=sys.stderr)
          sys.exit(1)
          PY

      - name: Validate bridge payload
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/fsis-recalls.json'))
          rows=p.get('records',[])
          assert isinstance(rows,list) and len(rows)>0, 'FSIS bridge has no records'
          assert p.get('authority')=='USDA Food Safety and Inspection Service'
          print('Validated',len(rows),'FSIS records from',p.get('sourceType'))
          PY

      - name: Commit refreshed FSIS bridge
        run: |
          git config user.name "safeplate-fsis-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add data/fsis-recalls.json
          git commit -m "Refresh authoritative USDA FSIS bridge [skip netlify]" || exit 0
          git pull --rebase origin safeplate-command-center-staging
          git push origin HEAD:safeplate-command-center-staging

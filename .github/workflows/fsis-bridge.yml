name: SAFEPLATE USDA FSIS bridge

on:
  push:
    branches:
      - safeplate-command-center-staging
    paths:
      - .github/workflows/fsis-bridge.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-fsis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safeplate-command-center-staging

      - name: Fetch authoritative FSIS recall data
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, html as htmlmod, json, re, sys, time
          import urllib.request, urllib.error, xml.etree.ElementTree as ET
          from pathlib import Path

          OUT=Path('data/fsis-recalls.json')
          OUT.parent.mkdir(parents=True, exist_ok=True)
          UA='SAFEPLATE-FSIS-Bridge/1.1 (+https://safeplate-intelligence.netlify.app)'
          attempts=[]

          def get(url, accept='*/*', timeout=25, record=True):
              req=urllib.request.Request(url, headers={
                  'User-Agent':UA,
                  'Accept':accept,
                  'Accept-Language':'en-US,en;q=0.9'
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.geturl(), r.read()
              except urllib.error.HTTPError as e:
                  if record: attempts.append({'url':url,'http':e.code,'error':str(e)})
              except Exception as e:
                  if record: attempts.append({'url':url,'http':None,'error':repr(e)})
              return None,url,b''

          def clean(s):
              s=htmlmod.unescape(s or '')
              s=re.sub(r'<[^>]+>',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          def txt(el, names):
              for name in names:
                  v=el.findtext(name)
                  if v and v.strip(): return v.strip()
              return ''

          def parse_rss(body, source_url, filter_fsis=False):
              try:
                  root=ET.fromstring(body)
              except Exception as e:
                  attempts.append({'url':source_url,'http':200,'error':'XML parse: '+repr(e),'prefix':body[:120].decode('utf-8','replace')})
                  return []
              records=[]
              for item in root.findall('.//item'):
                  title=txt(item,['title'])
                  link=txt(item,['link','guid'])
                  desc=clean(txt(item,['description','summary']))
                  pub=txt(item,['pubDate','date'])
                  combined=' '.join([title,link,desc])
                  if filter_fsis and not (re.search(r'\b(?:FSIS|USDA|Food Safety and Inspection Service)\b',combined,re.I) or 'fsis.usda.gov' in link.lower() or '/accounts/USFSIS/' in link):
                      continue
                  number=(re.search(r'\b(?:PHA-\d{8}-\d+|\d{3}-\d{4})\b',combined,re.I) or [None])[0]
                  classification=(re.search(r'Class\s+(?:I{1,3})\b',combined,re.I) or [None])[0]
                  states='Nationwide' if re.search(r'\bNationwide\b',combined,re.I) else ''
                  records.append({
                      'field_recall_number':number or re.sub(r'\W+','-',title.lower()).strip('-')[:80],
                      'field_title':title or 'USDA FSIS recall/public health alert',
                      'field_reason_for_recall':desc or title,
                      'field_recall_classification':classification or '',
                      'field_states':states,
                      'field_recall_url':link or source_url,
                      'field_recall_date':pub
                  })
              return records

          def write_payload(records, source_type, source_url):
              payload={
                  'capturedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
                  'authority':'USDA Food Safety and Inspection Service',
                  'sourceType':source_type,
                  'sourceUrl':source_url,
                  'records':records[:500],
                  'attempts':attempts
              }
              OUT.write_text(json.dumps(payload,indent=2))
              print(f'FSIS bridge OK: {len(payload["records"])} records via {source_type} -> {source_url}')
              sys.exit(0)

          # 1) Primary: official FSIS Recall API.
          api='https://www.fsis.usda.gov/fsis/api/recall/v/1'
          status,final,body=get(api,'application/json,text/plain;q=0.9,*/*;q=0.8')
          if status and 200 <= status < 300:
              try:
                  j=json.loads(body.decode('utf-8','replace'))
                  rows=j if isinstance(j,list) else (j.get('results') or j.get('data') or j.get('rows') or [])
                  if rows: write_payload(rows,'FSIS Recall API',final)
              except Exception as e:
                  attempts.append({'url':api,'http':status,'error':'JSON parse: '+repr(e)})

          # 2) Official FSIS-hosted RSS.
          for feed in ['https://www.fsis.usda.gov/RSS/usdarss.xml','http://www.fsis.usda.gov/RSS/usdarss.xml']:
              status,final,body=get(feed,'application/rss+xml,application/xml,text/xml;q=0.9,*/*;q=0.8')
              if status and 200 <= status < 300 and body:
                  rows=parse_rss(body,final)
                  if rows: write_payload(rows,'FSIS RSS',final)

          # 3) Official USDA/FSIS GovDelivery account. FSIS itself identifies GovDelivery
          # as its subscription service; public topic feeds are an agency-controlled publication path.
          signup='https://public.govdelivery.com/accounts/USFSIS/subscriber/new'
          status,final,body=get(signup,'text/html,application/xhtml+xml')
          topic_ids=[]
          if status and body:
              page=body.decode('utf-8','replace')
              topic_ids=sorted(set(re.findall(r'USFSIS_\d+',page)))
              print('GovDelivery topic ids discovered from FSIS signup page:',len(topic_ids))

          # If the public signup page does not expose topic IDs in static HTML, discover
          # only public RSS topic URLs for the official USFSIS account.
          if not topic_ids:
              topic_ids=[f'USFSIS_{i}' for i in range(1,251)]

          def probe(topic):
              url=f'https://public.govdelivery.com/topics/{topic}/feed.rss'
              st,fn,bd=get(url,'application/rss+xml,application/xml,text/xml;q=0.9,*/*;q=0.8',timeout=12,record=False)
              if not st or not (200 <= st < 300) or not bd.startswith((b'<?xml',b'<rss',b'<feed')):
                  return None
              try:
                  root=ET.fromstring(bd)
              except Exception:
                  return None
              title=(root.findtext('./channel/title') or root.findtext('{http://www.w3.org/2005/Atom}title') or '').strip()
              desc=(root.findtext('./channel/description') or '').strip()
              return {'topic':topic,'url':fn,'body':bd,'title':title,'description':desc}

          feeds=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              for x in ex.map(probe,topic_ids):
                  if x: feeds.append(x)

          print('Accessible official USFSIS GovDelivery feeds:',[(x['topic'],x['title']) for x in feeds])
          preferred=[]
          for x in feeds:
              meta=(x['title']+' '+x['description']).lower()
              if 'recall' in meta or 'public health alert' in meta or 'food safety' in meta:
                  preferred.append(x)
          preferred += [x for x in feeds if x not in preferred]

          for x in preferred:
              rows=parse_rss(x['body'],x['url'],filter_fsis=False)
              if rows:
                  meta=(x['title']+' '+x['description']).lower()
                  # Only accept a feed if its metadata or content is clearly recall/alert related.
                  sample=' '.join((r.get('field_title','')+' '+r.get('field_reason_for_recall','')) for r in rows[:10]).lower()
                  if any(k in meta+' '+sample for k in ['recall','public health alert','food safety alert']):
                      write_payload(rows,f'Official USDA/FSIS GovDelivery RSS ({x["topic"]}: {x["title"]})',x['url'])

          # 4) CDC/HHS combined federal food-safety feed documented by Data.gov as
          # integrating the USDA FSIS and FDA XML feeds. Some responses are HTML wrappers,
          # so extract any embedded RSS/XML before parsing.
          cdc='https://www2c.cdc.gov/podcasts/createrss.asp?c=146'
          status,final,body=get(cdc,'application/rss+xml,application/xml,text/xml,text/html;q=0.8,*/*;q=0.5')
          if status and body:
              candidates=[body]
              text=body.decode('utf-8','replace')
              m=re.search(r'(<rss[\s\S]*?</rss>)',text,re.I)
              if m: candidates.append(m.group(1).encode())
              for candidate in candidates:
                  rows=parse_rss(candidate,final,filter_fsis=True)
                  if rows: write_payload(rows,'CDC/HHS integrated federal food-safety RSS (USDA/FSIS filtered)',final)

          print(json.dumps({'error':'No authoritative USDA/FSIS publication path returned usable records','attempts':attempts,'govdeliveryFeeds':[(x['topic'],x['title']) for x in feeds]},indent=2),file=sys.stderr)
          sys.exit(1)
          PY

      - name: Validate bridge payload
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/fsis-recalls.json'))
          rows=p.get('records',[])
          assert isinstance(rows,list) and len(rows)>0, 'FSIS bridge has no records'
          assert p.get('authority')=='USDA Food Safety and Inspection Service'
          assert p.get('sourceUrl','').startswith('http')
          print('Validated',len(rows),'FSIS records from',p.get('sourceType'))
          PY

      - name: Commit refreshed FSIS bridge
        run: |
          git config user.name "safeplate-fsis-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add data/fsis-recalls.json
          git commit -m "Refresh authoritative USDA FSIS bridge [skip netlify]" || exit 0
          git pull --rebase origin safeplate-command-center-staging
          git push origin HEAD:safeplate-command-center-staging

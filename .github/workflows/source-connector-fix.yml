name: SAFEPLATE source connector repair

on:
  push:
    branches: [safeplate-command-center-staging]
    paths: [.github/workflows/source-connector-fix.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safeplate-command-center-staging
      - name: Patch FSIS connector with official RSS fallback
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_fsis.py
          python /tmp/patch_fsis.py
          node --check netlify/functions/surveillance.mjs
          git config user.name "safeplate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/surveillance.mjs
          if git diff --cached --quiet; then
            echo "FSIS connector already patched."
          else
            git commit -m "Use official FSIS Recalls RSS fallback"
            git pull --rebase origin safeplate-command-center-staging
            git push origin HEAD:safeplate-command-center-staging
          fi

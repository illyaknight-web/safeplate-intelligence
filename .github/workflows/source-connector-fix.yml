name: SAFEPLATE FSIS authoritative bridge

on:
  push:
    branches: [safeplate-command-center-staging]
    paths: [.github/workflows/source-connector-fix.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync-fsis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safeplate-command-center-staging
      - name: Fetch official FSIS Recall API snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, datetime, pathlib
          u='https://www.fsis.usda.gov/fsis/api/recall/v/1'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 SAFEPLATE authoritative bridge','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as r:
              rows=json.loads(r.read().decode('utf-8','replace'))
          if not isinstance(rows,list) or not rows:
              raise SystemExit('FSIS API returned no records')
          payload={'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'source':u,'records':rows}
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/fsis-recalls.json').write_text(json.dumps(payload,separators=(',',':')))
          print('FSIS records:',len(rows))
          PY
      - name: Patch SAFEPLATE to use bridge when Netlify is blocked
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_fsis.py
          python /tmp/patch_fsis.py
          node --check netlify/functions/surveillance.mjs
      - name: Commit bridge snapshot and connector
        shell: bash
        run: |
          git config user.name "safeplate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fsis-recalls.json netlify/functions/surveillance.mjs
          if git diff --cached --quiet; then
            echo "No FSIS bridge changes."
            exit 0
          fi
          git commit -m "Refresh authoritative FSIS bridge [skip ci]"
          git pull --rebase origin safeplate-command-center-staging
          git push origin HEAD:safeplate-command-center-staging

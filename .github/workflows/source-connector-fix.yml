name: SAFEPLATE source connector diagnostic

on:
  push:
    branches: [safeplate-command-center-staging]
    paths: [.github/workflows/source-connector-fix.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safeplate-command-center-staging
      - name: Capture federal FoodSafety RSS sample
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          u='https://www2c.cdc.gov/podcasts/createrss.asp?c=146'
          req=urllib.request.Request(u,headers={'User-Agent':'SAFEPLATE-diagnostic/1.0','Accept':'application/rss+xml,application/xml,text/xml,*/*'})
          with urllib.request.urlopen(req,timeout=40) as r:
              data=r.read().decode('utf-8','replace')
          open('CDC_FEED_SAMPLE.txt','w').write(data[:30000])
          print(data[:5000])
          PY
          git config user.name "safeplate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CDC_FEED_SAMPLE.txt
          git commit -m "Capture FoodSafety federal RSS diagnostic sample" || true
          git pull --rebase origin safeplate-command-center-staging
          git push origin HEAD:safeplate-command-center-staging

[build]
  publish = "site"
  functions = "netlify/functions"

# Explicitly route the public Advanced View URL to the Food Journey function.
# This prevents /unified-intelligence.html from falling through to Netlify's 404 page.
[[redirects]]
  from = "/unified-intelligence.html"
  to = "/.netlify/functions/journey"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://tile.openstreetmap.org https://tiles.openfreemap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://raw.githubusercontent.com https://server.arcgisonline.com https://services.arcgisonline.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# Scheduled function is defined inline in surveillance.mjs:
# */30 * * * * = every 30 minutes
# Food Journey is served by netlify/functions/journey.mjs so selected-record query state is preserved.

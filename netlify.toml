[build]
  publish = "site"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://*.tile.openstreetmap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# Scheduled function is defined inline in surveillance.mjs:
# */30 * * * * = every 30 minutes
# Deployment nudge: Google Search Console verification asset added 2026-08-22.

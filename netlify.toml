[build]
  command = "node scripts/write-deployment-info.mjs"
  publish = "site"
  functions = "netlify/functions"

# SAFEPLATE Public images are served directly from site/assets.
# Do not redirect, rewrite, rotate, or substitute these paths.
# The Public HTML owns one immutable image source per slot.

# Explicitly route the public Advanced View URL to the Food Journey function.
# This prevents /unified-intelligence.html from falling through to Netlify's 404 page.
[[redirects]]
  from = "/booth"
  to = "/booth.html"
  status = 200
  force = true

[[redirects]]
  from = "/foodbank"
  to = "/booth.html"
  status = 200
  force = true

[[redirects]]
  from = "/widget"
  to = "/widget.html"
  status = 200
  force = true

[[redirects]]
  from = "/alerts"
  to = "/safeplate-shell.html"
  status = 200
  force = true

[[redirects]]
  from = "/search"
  to = "/safeplate-shell.html"
  status = 200
  force = true

[[redirects]]
  from = "/journey"
  to = "/safeplate-shell.html"
  status = 200
  force = true

[[redirects]]
  from = "/intelligence"
  to = "/safeplate-shell.html"
  status = 200
  force = true

[[redirects]]
  from = "/sources"
  to = "/safeplate-shell.html"
  status = 200
  force = true

[[redirects]]
  from = "/system-status"
  to = "/safeplate-shell.html"
  status = 200
  force = true

[[redirects]]
  from = "/unified-intelligence.html"
  to = "/intelligence?view=home"
  status = 302
  force = true

[[headers]]
  for = "/booth-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/booth*"
  [headers.values]
    Permissions-Policy = "geolocation=(), camera=(self), microphone=()"

[[headers]]
  for = "/widget.html"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: https:; frame-ancestors *; object-src 'none'; base-uri 'self'"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/safeplate-widget.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://tile.openstreetmap.org https://tiles.openfreemap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://raw.githubusercontent.com https://server.arcgisonline.com https://services.arcgisonline.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# Scheduled function is defined inline in surveillance.mjs:
# */30 * * * * = every 30 minutes
# Food Journey is served by netlify/functions/journey.mjs so selected-record query state is preserved.
